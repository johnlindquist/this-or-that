<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio · This or that</title>
  <link rel="stylesheet" href="/chrome-designs/fonts.css">
  <script src="/chrome-designs/runtime.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --canvas: #edf0f2;
      --paper: #fcfdfd;
      --bar: #f6f8f9;
      --field: #f8fafb;
      --ink: #263039;
      --muted: #59656e;
      --line: #dce2e6;
      --control-line: #aab5bd;
      --blue: #365e7d;
      --blue-wash: #edf3f8;
      --clay: #805b49;
      --clay-wash: #f6efea;
      --hover: #e7edf1;
      --selection: #d5e4f0;
      --scroll-thumb: #8b99a3;
      --shadow: 0 8px 32px #23334212;
      --control-shadow: 0 1px 2px #23334212;
      --font-reading: 'Atkinson Hyperlegible Next', sans-serif;
      --font-control: 'Lato', sans-serif;
      --type-small: 12px;
      --type-label: 13px;
      --type-body: 16px;
      --type-title: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --radius-control: 5px;
      --radius-window: 12px;
      --preview-height: clamp(400px, 50vh, 480px);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); scrollbar-color: var(--scroll-thumb) var(--canvas); scrollbar-width: thin; }
    body { margin: 0; padding: var(--space-6); color: var(--ink); font-family: var(--font-reading); font-size: var(--type-body); line-height: 1.5; }
    ::selection { color: var(--ink); background: var(--selection); }
    ::-webkit-scrollbar { width: var(--space-2); height: var(--space-2); }
    ::-webkit-scrollbar-track { background: var(--canvas); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 2px solid var(--canvas); border-radius: var(--radius-control); }
    button, textarea { font: inherit; }
    button, a, textarea { -webkit-tap-highlight-color: var(--selection); }
    button { cursor: pointer; }
    a { color: var(--blue); text-underline-offset: var(--space-1); }
    button:focus-visible, a:focus-visible, textarea:focus-visible, iframe:focus-visible { outline: 2px solid var(--blue); outline-offset: var(--space-1); }
    svg { width: var(--space-4); height: var(--space-4); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .document { max-width: 1440px; margin: 0 auto; background: var(--paper); border-radius: var(--radius-window); box-shadow: var(--shadow); overflow: hidden; }
    .project-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-4); min-height: 48px; padding: var(--space-3) var(--space-8); background: var(--bar); border-bottom: 1px solid var(--line); font-family: var(--font-control); font-size: var(--type-label); }
    .brand { display: flex; align-items: center; gap: var(--space-2); font-weight: 700; }
    .brand svg { color: var(--blue); }
    h1 { margin: 0; font-size: var(--type-label); font-weight: 700; line-height: 1.5; }
    .study-name { justify-self: end; color: var(--muted); }
    .spread { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .folio { min-width: 0; padding: var(--space-6) var(--space-8); --accent: var(--blue); --accent-wash: var(--blue-wash); }
    .folio + .folio { border-left: 1px solid var(--line); --accent: var(--clay); --accent-wash: var(--clay-wash); }
    .folio-heading { display: flex; align-items: center; gap: var(--space-3); }
    .page-marker { display: grid; place-items: center; width: var(--space-6); height: var(--space-6); border: 1px solid var(--accent); border-radius: var(--radius-control); color: var(--accent); font-family: var(--font-control); font-size: var(--type-small); font-weight: 700; flex: 0 0 auto; }
    h2 { margin: 0; font-size: var(--type-title); font-weight: 650; letter-spacing: -.025em; line-height: 1.25; text-wrap: balance; }
    .folio-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin: var(--space-1) 0 var(--space-4); font-family: var(--font-control); font-size: var(--type-small); color: var(--muted); line-height: 1.5; }
    .folio-meta a { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--space-6); color: var(--muted); text-decoration: none; }
    .folio-meta a:hover { color: var(--accent); text-decoration: underline; }
    .folio-meta svg { width: var(--space-3); height: var(--space-3); }
    .preview { background: var(--field); border: 1px solid var(--line); }
    iframe { display: block; width: 100%; height: var(--preview-height); border: 0; background: var(--paper); }
    .annotation { margin-top: var(--space-4); }
    .annotation-label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-1); }
    .annotation label { font-weight: 600; font-size: var(--type-label); }
    .optional { font-family: var(--font-control); color: var(--muted); font-size: var(--type-small); }
    textarea { display: block; width: 100%; min-height: 64px; resize: vertical; padding: var(--space-2) var(--space-3); border: 1px solid var(--control-line); border-radius: var(--radius-control); color: var(--ink); background: var(--field); font-size: var(--type-label); line-height: 1.5; caret-color: var(--accent); }
    textarea::placeholder { color: var(--muted); opacity: 1; }
    textarea:hover { border-color: var(--accent); }
    textarea:focus { background: var(--paper); }
    .decision { margin-top: var(--space-4); }
    .choose { display: inline-flex; align-items: center; justify-content: flex-start; gap: var(--space-2); min-height: var(--space-10); max-width: 100%; padding: var(--space-2) var(--space-3); border: 1px solid var(--control-line); border-radius: var(--radius-control); box-shadow: var(--control-shadow); color: var(--accent); background: var(--paper); font-family: var(--font-control); font-size: var(--type-label); font-weight: 700; text-align: left; line-height: 1.5; transition: background-color 160ms var(--ease-out), border-color 160ms var(--ease-out), color 160ms var(--ease-out); }
    .choose .check { width: var(--space-4); height: var(--space-4); border: 1px solid currentColor; border-radius: 3px; display: grid; place-items: center; flex: 0 0 auto; }
    .check svg { width: var(--space-3); height: var(--space-3); visibility: hidden; }
    .choose:hover { border-color: var(--accent); background: var(--accent-wash); }
    .choose[aria-pressed="true"] { color: var(--paper); background: var(--accent); border-color: var(--accent); }
    .choose[aria-pressed="true"] .check svg { visibility: visible; }
    .feedback { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3) var(--space-6); min-height: 64px; padding: var(--space-3) var(--space-8); border-top: 1px solid var(--line); background: var(--bar); }
    .feedback-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .feedback button { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--space-8); padding: var(--space-1) var(--space-3); border: 1px solid var(--control-line); border-radius: var(--radius-control); background: var(--paper); color: var(--ink); font-family: var(--font-control); font-size: var(--type-label); line-height: 1.5; box-shadow: var(--control-shadow); }
    .feedback button:hover { background: var(--hover); border-color: var(--muted); }
    .feedback button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .feedback button[aria-pressed="true"] svg { stroke-width: 2; }
    .status { margin: 0; color: var(--muted); font-family: var(--font-control); font-size: var(--type-small); line-height: 1.5; }
    button:disabled { cursor: not-allowed; color: var(--muted); background: var(--line); box-shadow: none; }
    textarea:disabled { color: var(--muted); background: var(--line); cursor: not-allowed; }
    @media (max-width: 1100px) {
      body { padding: var(--space-4); }
      .project-bar, .feedback { padding-left: var(--space-6); padding-right: var(--space-6); }
      .folio { padding: var(--space-6); }
      .status { flex-basis: 100%; }
    }
    @media (max-width: 760px) {
      body { padding: var(--space-3); }
      .project-bar { grid-template-columns: 1fr auto; gap: var(--space-1) var(--space-4); padding: var(--space-3) var(--space-5); }
      .brand { grid-column: 1; }
      h1 { grid-column: 1; grid-row: 2; color: var(--muted); font-weight: 400; }
      .study-name { grid-column: 2; grid-row: 1 / 3; }
      .spread { grid-template-columns: minmax(0, 1fr); }
      .folio { padding: var(--space-6) var(--space-5); }
      .folio + .folio { border-left: 0; border-top: 1px solid var(--line); }
      .folio-heading { align-items: flex-start; }
      .page-marker { margin-top: var(--space-1); }
      .folio-meta { margin-top: var(--space-2); }
      .choose { width: 100%; min-height: 44px; }
      .feedback { padding: var(--space-4) var(--space-5); }
      .feedback-actions { gap: var(--space-2); }
      .feedback button { min-height: 44px; padding-left: var(--space-2); padding-right: var(--space-2); }
      .feedback button svg { display: none; }
      .status { max-width: 38ch; }
    }
    @media (prefers-reduced-motion: reduce) {
      .choose { transition: none; }
    }
  </style>
</head>
<body data-design="things-folio">
  <!-- THESIS: Two complete reading paths, like facing pages in a working folio. OWN-WORLD: Things' quiet native document windows translated into cool paper, generous readable type, precise small controls, and a single central rule, without a sidebar or imitation window furniture. FIRST VIEWPORT: Original interactive candidates occupy most of both pages; each title leads directly through its preview, notes, and decision. INTERACTION: Independent previews and notes, local sample choices, then a quiet shared response row. Textual Left/Right markers remain clear without color. SEED: 9743c350, user-pinned Things reference; Folio is variant 2. -->
  <main class="document" aria-label="Folio comparison review">
    <header class="project-bar">
      <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h5v12H3zM12 4h5v12h-5z"/></svg><span>This or that</span></div>
      <h1>Sprint distribution</h1>
      <span class="study-name">Folio</span>
    </header>
    <div class="spread">
      <section class="folio" aria-labelledby="folio-left-title">
        <header>
          <div class="folio-heading"><span class="page-marker" aria-hidden="true">L</span><h2 id="folio-left-title">Blueprint workbench</h2></div>
          <div class="folio-meta"><span>Left candidate · 20</span><a href="/candidates/20-blueprint-desk.html" target="_blank" rel="noopener" aria-label="Open Blueprint workbench larger in a new tab">Open larger<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3 7 9M6 3H3v10h10v-3"/></svg></a></div>
        </header>
        <div class="preview"><iframe data-candidate="left" title="Blueprint workbench interactive preview" src="/candidates/20-blueprint-desk.html" sandbox="allow-scripts allow-same-origin"></iframe></div>
        <div class="annotation">
          <div class="annotation-label"><label for="folio-left-note">Notes on Blueprint workbench</label><span class="optional">Optional</span></div>
          <textarea data-note="left" id="folio-left-note" rows="2" placeholder="What works well? What would you change?"></textarea>
        </div>
        <div class="decision"><button class="choose" type="button" data-vote="left" aria-pressed="false"><span class="check" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span><span>Choose Blueprint workbench</span></button></div>
      </section>
      <section class="folio" aria-labelledby="folio-right-title">
        <header>
          <div class="folio-heading"><span class="page-marker" aria-hidden="true">R</span><h2 id="folio-right-title">Team routes</h2></div>
          <div class="folio-meta"><span>Right candidate · 11</span><a href="/candidates/11-metro-routes.html" target="_blank" rel="noopener" aria-label="Open Team routes larger in a new tab">Open larger<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3 7 9M6 3H3v10h10v-3"/></svg></a></div>
        </header>
        <div class="preview"><iframe data-candidate="right" title="Team routes interactive preview" src="/candidates/11-metro-routes.html" sandbox="allow-scripts allow-same-origin"></iframe></div>
        <div class="annotation">
          <div class="annotation-label"><label for="folio-right-note">Notes on Team routes</label><span class="optional">Optional</span></div>
          <textarea data-note="right" id="folio-right-note" rows="2" placeholder="What works well? What would you change?"></textarea>
        </div>
        <div class="decision"><button class="choose" type="button" data-vote="right" aria-pressed="false"><span class="check" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span><span>Choose Team routes</span></button></div>
      </section>
    </div>
    <footer class="feedback">
      <div class="feedback-actions" role="group" aria-label="Other sample responses">
        <button type="button" data-vote="skip" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h11m-4-4 4 4-4 4m7-10v12"/></svg>Skip</button>
        <button type="button" data-vote="like" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>Like both</button>
        <button type="button" data-vote="hate" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>Hate both</button>
      </div>
      <p class="status" data-status role="status" aria-live="polite">Preview only. Responses are not recorded.</p>
    </footer>
  </main>
</body>
</html>
