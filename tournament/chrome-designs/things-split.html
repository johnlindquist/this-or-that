<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split · This or that</title>
  <link rel="stylesheet" href="/chrome-designs/fonts.css">
  <script src="/chrome-designs/runtime.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Source Sans 3', sans-serif;
      color: var(--ink);
      background: var(--canvas);
      --canvas: #343c46;
      --toolbar: #38414b;
      --drawer: #3c4651;
      --field: #343e49;
      --control: #4b5865;
      --hover: #5b6a78;
      --line: #56616d;
      --ink: #f3f0e9;
      --secondary: #cbd2d8;
      --accent: #bfd8ed;
      --selected: #596f82;
      --selection: #637d94;
      --transparent: transparent;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 20px;
      --s6: 24px;
      --s8: 32px;
      --s10: 40px;
      --s12: 48px;
      --text-small: 13px;
      --text-body: 14px;
      --text-label: 16px;
      --text-title: 20px;
      --radius-control: 6px;
      --radius-panel: 12px;
      --toolbar-height: 72px;
      --notes-height: 64px;
      --row-label-width: 80px;
      --frame-height: clamp(400px, calc(100dvh - 360px), 520px);
      --stroke: 1px;
      --focus-width: 2px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --duration: 180ms;
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) var(--canvas); }
    body { margin: 0; font-size: var(--text-body); line-height: 1.45; }
    h1, h2, p { margin: 0; }
    button, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: var(--transparent); touch-action: manipulation; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    a { color: inherit; text-underline-offset: var(--s1); }
    :where(button, a, textarea):focus-visible { outline: var(--focus-width) solid var(--accent); outline-offset: var(--s1); }
    ::selection { background: var(--selection); color: var(--ink); }
    svg { width: var(--s4); height: var(--s4); flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    [hidden] { display: none !important; }
    .toolbar {
      min-height: var(--toolbar-height);
      padding: var(--s4) var(--s8);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: var(--s6);
      background: var(--toolbar);
      border-bottom: var(--stroke) solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: var(--s2); color: var(--secondary); font-family: 'Lato', sans-serif; font-weight: 700; font-size: var(--text-small); }
    .brand svg { width: var(--s5); height: var(--s5); }
    h1 { font-size: var(--text-title); line-height: 1.2; font-weight: 600; letter-spacing: -.02em; text-align: center; }
    .context-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); }
    .tool { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--s8); padding: var(--s1) var(--s2); color: var(--secondary); background: var(--transparent); border: 0; border-radius: var(--radius-control); font-size: var(--text-small); transition: background var(--duration) var(--ease), color var(--duration) var(--ease); }
    .tool:hover:not(:disabled) { background: var(--control); color: var(--ink); }
    .tool[aria-expanded="true"] { color: var(--ink); }
    main { padding: var(--s4) var(--s8) var(--s6); }
    .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s6); }
    .candidate { min-width: 0; }
    .candidate-header { min-height: var(--s12); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0 var(--s2) var(--s2); }
    .candidate-title { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
    .side { font-family: 'Lato', sans-serif; font-size: var(--text-small); color: var(--secondary); border-right: var(--stroke) solid var(--line); padding-right: var(--s3); }
    h2 { font-size: var(--text-label); font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
    .open { display: inline-flex; align-items: center; gap: var(--s1); flex-shrink: 0; color: var(--secondary); font-size: var(--text-small); text-decoration: none; padding: var(--s1); border-radius: var(--radius-control); }
    .open:hover { color: var(--ink); text-decoration: underline; }
    .preview { overflow: hidden; border-radius: var(--radius-panel); background: var(--field); }
    iframe { display: block; width: 100%; height: var(--frame-height); border: 0; color-scheme: normal; }
    .drawer { margin-top: var(--s6); background: var(--drawer); border-radius: var(--radius-panel); padding: 0 var(--s5); }
    .drawer-row { display: grid; grid-template-columns: var(--row-label-width) minmax(0, 1fr); align-items: center; gap: var(--s4); padding: var(--s4) 0; }
    .row-heading { font-size: var(--text-body); font-weight: 600; }
    .notes-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s6); }
    .note { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
    .note label { color: var(--secondary); font-size: var(--text-small); white-space: nowrap; }
    textarea { display: block; min-width: 0; width: 100%; min-height: var(--notes-height); height: var(--notes-height); resize: vertical; padding: var(--s2) var(--s3); background: var(--field); color: var(--ink); border: var(--stroke) solid var(--line); border-radius: var(--radius-control); caret-color: var(--accent); line-height: 1.5; }
    textarea::placeholder { color: var(--secondary); opacity: 1; }
    textarea:hover { border-color: var(--secondary); }
    textarea:focus { border-color: var(--accent); }
    .response-row { border-top: var(--stroke) solid var(--line); }
    .responses { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
    .choice { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--s10); padding: var(--s2) var(--s3); background: var(--control); color: var(--ink); border: var(--stroke) solid var(--transparent); border-radius: var(--radius-control); line-height: 1.25; transition: background var(--duration) var(--ease), border-color var(--duration) var(--ease); }
    .choice:hover:not(:disabled) { background: var(--hover); }
    .choice[aria-pressed="true"] { background: var(--selected); border-color: var(--accent); }
    .choice .mark { width: var(--s4); height: var(--s4); display: inline-flex; align-items: center; justify-content: center; border: var(--stroke) solid var(--secondary); border-radius: var(--s1); }
    .choice .mark svg { visibility: hidden; width: var(--s3); height: var(--s3); }
    .choice[aria-pressed="true"] .mark svg { visibility: visible; }
    .choice[aria-pressed="true"] .mark { border-color: var(--accent); }
    .pair-responses { display: flex; gap: var(--s2); margin-left: auto; }
    .pair-responses .choice { color: var(--secondary); background: var(--field); }
    .pair-responses .choice:hover:not(:disabled) { background: var(--control); color: var(--ink); }
    .pair-responses .choice[aria-pressed="true"] { background: var(--selected); color: var(--ink); }
    .status { margin: var(--s3) var(--s5) 0; color: var(--secondary); font-size: var(--text-small); min-height: var(--s5); }
    @media (max-width: 1100px) {
      .toolbar { padding-inline: var(--s6); gap: var(--s4); }
      main { padding-inline: var(--s6); }
      .split, .notes-grid { gap: var(--s4); }
      .drawer-row { grid-template-columns: 64px minmax(0, 1fr); gap: var(--s3); }
      .candidate-title { gap: var(--s2); }
      .side { padding-right: var(--s2); }
      .choice { padding-inline: var(--s2); }
      .pair-responses { margin-left: 0; }
    }
    @media (max-width: 720px) {
      .toolbar { grid-template-columns: 1fr auto; padding: var(--s4); gap: var(--s3); }
      h1 { grid-column: 1 / -1; grid-row: 2; text-align: left; padding-top: var(--s2); }
      .context-actions { grid-column: 2; grid-row: 1; }
      main { padding: var(--s3) var(--s4) var(--s5); }
      .split { grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
      .candidate-header { flex-wrap: wrap; padding-inline: 0; }
      .open { min-height: var(--s8); }
      .drawer { padding-inline: var(--s4); }
      .drawer-row { grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
      .notes-grid { grid-template-columns: minmax(0, 1fr); }
      .note label { min-width: var(--s8); }
      .responses { align-items: stretch; }
      .responses > .choice { width: 100%; justify-content: flex-start; }
      .pair-responses { width: 100%; }
      .pair-responses .choice { flex: 1; }
      .choice, .tool { min-height: 44px; }
      .status { margin-inline: var(--s1); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body data-design="things-split">
  <!-- THESIS: A quiet evening workspace, with two uninterrupted previews and one shared place to think. OWN-WORLD: Things' restrained project typography, inset task grouping and horizontal section rules translated into medium slate, warm text and gentle native controls. FIRST VIEWPORT: Centered project context, large left/right previews, then a compact full-width notes and response drawer. INTERACTION: Independent live candidates, editable notes, reversible sample choices and a discoverable drawer toggle. SEED: 9743c350; user-pinned Things reference, variant 3, Split. -->
  <header class="toolbar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14"/></svg>This or that</div>
    <h1>Sprint distribution</h1>
    <div class="context-actions" aria-label="Comparison actions">
      <button class="tool" type="button" data-panel-toggle="split-notes" aria-controls="split-notes" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>Notes</button>
      <button class="tool" type="button" data-action="reset" title="Clear local notes and sample response"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a7 7 0 1 1-1 6M5 4v5h5"/></svg>Reset</button>
    </div>
  </header>
  <main>
    <section class="split" aria-label="Compare original designs">
      <article class="candidate" aria-labelledby="split-left-title">
        <header class="candidate-header">
          <div class="candidate-title"><span class="side">Left</span><h2 id="split-left-title">Blueprint workbench</h2></div>
          <a class="open" href="/candidates/20-blueprint-desk.html" target="_blank" rel="noopener" aria-label="Open Blueprint workbench larger">Open larger<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 5H5v14h14v-5"/></svg></a>
        </header>
        <div class="preview"><iframe data-candidate="left" title="Blueprint workbench interactive preview" src="/candidates/20-blueprint-desk.html" sandbox="allow-scripts allow-same-origin"></iframe></div>
      </article>
      <article class="candidate" aria-labelledby="split-right-title">
        <header class="candidate-header">
          <div class="candidate-title"><span class="side">Right</span><h2 id="split-right-title">Team routes</h2></div>
          <a class="open" href="/candidates/11-metro-routes.html" target="_blank" rel="noopener" aria-label="Open Team routes larger">Open larger<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 5H5v14h14v-5"/></svg></a>
        </header>
        <div class="preview"><iframe data-candidate="right" title="Team routes interactive preview" src="/candidates/11-metro-routes.html" sandbox="allow-scripts allow-same-origin"></iframe></div>
      </article>
    </section>
    <section class="drawer" aria-label="Notes and sample response">
      <div class="drawer-row" id="split-notes">
        <h2 class="row-heading">Notes</h2>
        <div class="notes-grid">
          <div class="note"><label for="split-left-note">Left</label><textarea id="split-left-note" data-note="left" aria-label="Notes on Blueprint workbench" placeholder="What stands out in Blueprint workbench?"></textarea></div>
          <div class="note"><label for="split-right-note">Right</label><textarea id="split-right-note" data-note="right" aria-label="Notes on Team routes" placeholder="What stands out in Team routes?"></textarea></div>
        </div>
      </div>
      <div class="drawer-row response-row">
        <h2 class="row-heading" id="split-response-label">Response</h2>
        <div class="responses" role="group" aria-labelledby="split-response-label">
          <button class="choice" type="button" data-vote="left" aria-pressed="false"><span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>Choose Blueprint workbench</button>
          <button class="choice" type="button" data-vote="right" aria-pressed="false"><span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>Choose Team routes</button>
          <div class="pair-responses">
            <button class="choice" type="button" data-vote="like" aria-pressed="false">Like both</button>
            <button class="choice" type="button" data-vote="hate" aria-pressed="false">Hate both</button>
            <button class="choice" type="button" data-vote="skip" aria-pressed="false">Skip</button>
          </div>
        </div>
      </div>
    </section>
    <p class="status" data-status role="status" aria-live="polite">Preview only. Responses are not recorded.</p>
  </main>
</body>
</html>
