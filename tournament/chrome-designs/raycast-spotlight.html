<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight · This or that</title>
  <link rel="stylesheet" href="/chrome-designs/fonts.css">
  <script src="/chrome-designs/runtime.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Roboto', sans-serif;
      font-synthesis: none;
      --canvas: #20232b;
      --surface: #282d37;
      --action-surface: #303744;
      --field: #222730;
      --hover: #3a4351;
      --line: #424a58;
      --control-line: #687487;
      --ink: #f0f2f5;
      --muted: #b5becb;
      --soft-ink: #d1d8e2;
      --green: #a2e1b3;
      --green-field: #2a4036;
      --green-hover: #355341;
      --amber: #f0ce8a;
      --amber-field: #433b2d;
      --amber-hover: #584b35;
      --focus: #d2e4fc;
      --selection: #465a74;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 20px;
      --s6: 24px;
      --s8: 32px;
      --s10: 40px;
      --s12: 48px;
      --text-small: 12px;
      --text-body: 14px;
      --text-title: 16px;
      --text-heading: 24px;
      --radius-small: 6px;
      --radius: 12px;
      --preview-height: clamp(400px, calc(100dvh - 420px), 500px);
      --ease: cubic-bezier(.22, 1, .36, 1);
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--control-line) var(--canvas); }
    body { margin: 0; min-width: 320px; font-size: var(--text-body); line-height: 1.45; }
    h1, h2, p { margin: 0; }
    button, textarea { font: inherit; }
    button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, textarea:focus-visible, iframe:focus-visible { outline: 2px solid var(--focus); outline-offset: var(--s1); }
    ::selection { color: var(--ink); background: var(--selection); }
    a { color: var(--soft-ink); text-underline-offset: var(--s1); }
    a:hover { color: var(--ink); }
    svg { width: var(--s4); height: var(--s4); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    [hidden] { display: none !important; }
    .masthead { min-height: var(--s12); padding: var(--s2) var(--s6); display: flex; align-items: center; justify-content: space-between; gap: var(--s4); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: var(--s2); font-family: 'Geist', sans-serif; font-weight: 600; }
    .brand svg { width: var(--s5); height: var(--s5); }
    .study-name { color: var(--muted); font-size: var(--text-small); font-family: 'Geist', sans-serif; }
    main { padding: 0 var(--s6) var(--s4); }
    .project-heading { padding: var(--s4) 0; text-align: center; }
    h1 { font-size: var(--text-heading); font-weight: 600; letter-spacing: -.025em; line-height: 1.25; }
    .project-heading p { color: var(--muted); margin-top: var(--s1); font-size: var(--text-small); }
    .decision-band { display: flex; justify-content: center; gap: var(--s3); padding: var(--s3) var(--s4); background: var(--action-surface); border-radius: var(--radius); }
    .choice { display: flex; align-items: center; justify-content: space-between; gap: var(--s6); min-height: var(--s12); width: 320px; border: 1px solid currentColor; border-radius: var(--radius-small); padding: var(--s2) var(--s4); font-weight: 500; line-height: 1.35; }
    .choice[data-vote="left"] { color: var(--green); background: var(--green-field); }
    .choice[data-vote="right"] { color: var(--amber); background: var(--amber-field); }
    .choice[data-vote="left"]:hover { background: var(--green-hover); }
    .choice[data-vote="right"]:hover { background: var(--amber-hover); }
    .choice[aria-pressed="true"][data-vote="left"] { background: var(--green); color: var(--field); }
    .choice[aria-pressed="true"][data-vote="right"] { background: var(--amber); color: var(--field); }
    .choice .selected-mark { display: none; }
    .choice[aria-pressed="true"] .selected-mark { display: block; }
    .choice[aria-pressed="true"] .direction-mark { display: none; }
    .comparison { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s4); margin-top: var(--s4); align-items: start; }
    .candidate { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); --side: var(--green); }
    .candidate-right { --side: var(--amber); }
    .candidate-heading { display: flex; align-items: center; gap: var(--s3); min-height: var(--s12); padding: var(--s2) var(--s3); }
    .side-label { color: var(--side); display: inline-flex; align-items: center; gap: var(--s1); font-family: 'Geist', sans-serif; font-size: var(--text-small); font-weight: 500; }
    .side-label svg { width: var(--s3); height: var(--s3); }
    h2 { font-size: var(--text-title); font-weight: 500; line-height: 1.25; }
    .notes-toggle { display: inline-flex; align-items: center; gap: var(--s1); margin-left: auto; flex-shrink: 0; }
    .quiet-button { background: transparent; color: var(--soft-ink); border: 1px solid transparent; border-radius: var(--radius-small); min-height: var(--s8); padding: var(--s1) var(--s2); font-size: var(--text-small); }
    .quiet-button:hover { color: var(--ink); background: var(--hover); }
    .notes-toggle[aria-expanded="true"] { color: var(--ink); background: var(--action-surface); }
    .notes-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    iframe { display: block; width: 100%; height: var(--preview-height); border: 0; background: var(--field); }
    .notes-drawer { padding: var(--s2) var(--s3) var(--s3); }
    .note-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s1); font-size: var(--text-small); }
    .note-heading label { color: var(--soft-ink); }
    .note-heading a { display: inline-flex; align-items: center; gap: var(--s1); font-size: var(--text-small); }
    .note-heading svg { width: var(--s3); height: var(--s3); }
    textarea { display: block; width: 100%; min-height: var(--s12); height: var(--s12); padding: var(--s2); resize: vertical; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--field); color: var(--ink); font-size: var(--text-body); line-height: 1.4; caret-color: var(--side); }
    textarea::placeholder { color: var(--muted); opacity: 1; }
    textarea:hover { border-color: var(--control-line); }
    textarea:focus { border-color: var(--side); }
    .feedback { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s3) var(--s6); padding: var(--s4) 0 0; }
    .feedback-controls { display: flex; align-items: center; gap: var(--s2); }
    .feedback-label { font-size: var(--text-small); color: var(--muted); margin-right: var(--s1); }
    .feedback-button { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--s10); border: 1px solid var(--line); border-radius: var(--radius-small); padding: var(--s2) var(--s3); background: var(--surface); color: var(--soft-ink); font-size: var(--text-small); }
    .feedback-button:hover { color: var(--ink); background: var(--hover); border-color: var(--control-line); }
    .feedback-button[aria-pressed="true"] { color: var(--ink); background: var(--selection); border-color: var(--focus); }
    .feedback-meta { display: flex; align-items: center; justify-content: flex-end; gap: var(--s3); }
    .status { color: var(--muted); font-size: var(--text-small); }
    .feedback-meta .quiet-button { text-decoration: underline; text-underline-offset: var(--s1); }
    .decision-band { animation: reveal-band 320ms var(--ease) both; }
    @keyframes reveal-band { from { clip-path: inset(0 2% 0 2% round var(--radius)); } to { clip-path: inset(0 0 0 0 round var(--radius)); } }
    @media (max-width: 1100px) {
      main { padding-left: var(--s4); padding-right: var(--s4); }
      .candidate-heading { flex-wrap: wrap; gap: var(--s2); }
      .candidate-heading h2 { font-size: var(--text-body); }
      .feedback { align-items: flex-start; }
      .feedback-meta { align-items: flex-end; flex-direction: column; gap: var(--s1); }
    }
    @media (max-width: 720px) {
      :root { --preview-height: 440px; }
      .masthead { padding-left: var(--s4); padding-right: var(--s4); }
      .project-heading { padding: var(--s6) 0 var(--s4); }
      .decision-band { padding: var(--s3); gap: var(--s2); flex-direction: column; }
      .choice { width: 100%; min-height: var(--s12); }
      .comparison { grid-template-columns: minmax(0, 1fr); gap: var(--s6); }
      .candidate-heading { gap: var(--s2); }
      .candidate-heading h2 { font-size: var(--text-body); }
      .notes-toggle { min-height: var(--s10); }
      .feedback { padding-top: var(--s6); flex-direction: column; align-items: stretch; gap: var(--s4); }
      .feedback-controls { flex-wrap: wrap; }
      .feedback-label { flex-basis: 100%; }
      .feedback-button { flex: 1; min-height: var(--s12); }
      .feedback-meta { align-items: flex-start; gap: var(--s2); }
      .feedback-meta .quiet-button { padding-left: 0; min-height: var(--s10); }
    }
    @media (prefers-reduced-motion: reduce) { .decision-band { animation: none; } }
  </style>
</head>
<body data-design="raycast-spotlight">
  <!-- THESIS: An expanded command result puts the decision above the work, not around it. OWN-WORLD: Roboto on solid navy-neutral planes, Geist utility labels, crisp green left and amber right. FIRST VIEWPORT: A centered project heading and two decisive actions lead directly into wide, independently interactive previews. INTERACTION: The in-flow decision band never obscures candidates; compact per-pane notes drawers and clearly labeled lower feedback use shared local-only state. Mobile stacks actions and candidates. SEED: 9743c350; user-pinned Raycast reference, variant 3 Spotlight. -->
  <header class="masthead">
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h5v10H3zM12 5h5v10h-5zM8 10h4"/></svg>This or that</div>
    <span class="study-name">Spotlight</span>
  </header>
  <main>
    <header class="project-heading">
      <h1>Sprint distribution</h1>
      <p>Explore each direction. Choose what works.</p>
    </header>
    <div class="decision-band" role="group" aria-label="Choose a candidate — local sample response">
      <button class="choice" type="button" data-vote="left" aria-pressed="false">
        <span>Choose Blueprint workbench</span>
        <svg class="direction-mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg>
        <svg class="selected-mark" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>
      </button>
      <button class="choice" type="button" data-vote="right" aria-pressed="false">
        <span>Choose Team routes</span>
        <svg class="direction-mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
        <svg class="selected-mark" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>
      </button>
    </div>
    <div class="comparison">
      <section class="candidate" aria-labelledby="spotlight-left-title">
        <header class="candidate-heading">
          <span class="side-label"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 8H4m3-3L4 8l3 3"/></svg>Left</span>
          <h2 id="spotlight-left-title">Blueprint workbench</h2>
          <button class="quiet-button notes-toggle" type="button" data-panel-toggle="spotlight-left-drawer" aria-controls="spotlight-left-drawer" aria-expanded="true">Notes<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        </header>
        <iframe data-candidate="left" title="Blueprint workbench interactive preview" src="/candidates/20-blueprint-desk.html" sandbox="allow-scripts allow-same-origin"></iframe>
        <div class="notes-drawer" id="spotlight-left-drawer">
          <div class="note-heading"><label for="spotlight-left-note">Left notes</label><a href="/candidates/20-blueprint-desk.html" target="_blank" rel="noopener">Open larger<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3 7 9M6 3H3v10h10v-3"/></svg></a></div>
          <textarea data-note="left" id="spotlight-left-note" rows="2" placeholder="What stands out in Blueprint workbench?"></textarea>
        </div>
      </section>
      <section class="candidate candidate-right" aria-labelledby="spotlight-right-title">
        <header class="candidate-heading">
          <span class="side-label">Right<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8M9 5l3 3-3 3"/></svg></span>
          <h2 id="spotlight-right-title">Team routes</h2>
          <button class="quiet-button notes-toggle" type="button" data-panel-toggle="spotlight-right-drawer" aria-controls="spotlight-right-drawer" aria-expanded="true">Notes<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        </header>
        <iframe data-candidate="right" title="Team routes interactive preview" src="/candidates/11-metro-routes.html" sandbox="allow-scripts allow-same-origin"></iframe>
        <div class="notes-drawer" id="spotlight-right-drawer">
          <div class="note-heading"><label for="spotlight-right-note">Right notes</label><a href="/candidates/11-metro-routes.html" target="_blank" rel="noopener">Open larger<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3 7 9M6 3H3v10h10v-3"/></svg></a></div>
          <textarea data-note="right" id="spotlight-right-note" rows="2" placeholder="What stands out in Team routes?"></textarea>
        </div>
      </section>
    </div>
    <footer class="feedback">
      <div class="feedback-controls" role="group" aria-labelledby="spotlight-feedback-label">
        <span class="feedback-label" id="spotlight-feedback-label">Pair feedback</span>
        <button class="feedback-button" type="button" data-vote="like" aria-pressed="false">Like both</button>
        <button class="feedback-button" type="button" data-vote="hate" aria-pressed="false">Hate both</button>
        <button class="feedback-button" type="button" data-vote="skip" aria-pressed="false">Skip<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 6 5-6 5M15 5v10"/></svg></button>
      </div>
      <div class="feedback-meta">
        <p class="status" data-status role="status" aria-live="polite">Preview only. Responses are not recorded.</p>
        <button class="quiet-button" type="button" data-action="reset">Clear response &amp; notes</button>
      </div>
    </footer>
  </main>
</body>
</html>
