<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People desk · Sprint distribution</title>
<style>
:root{color-scheme:light;--paper:#fffdf8;--ink:#352b28;--red:#b6382b;--line:#dfcfc6;--soft:#f4e8df;--muted:#786158;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;font-size:13px;background:var(--paper);color:var(--ink)}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.35}button:focus-visible,select:focus-visible{outline:3px solid #245b89;outline-offset:3px}button:hover:not(:disabled){background:var(--soft)}::selection{background:#efc2ad;color:#352b28}*{scrollbar-color:#c6947f var(--paper);scrollbar-width:thin}header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}header h1{font-size:19px;letter-spacing:-.5px;margin:0}header p{margin:0;color:var(--muted);font-size:11px}.tools{margin-left:auto;display:flex;gap:5px}.tools button,.plain{border:1px solid var(--line);background:transparent;border-radius:3px;padding:6px 9px}main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(220px,1fr);min-height:calc(100vh - 65px)}.roster{padding:20px 20px 14px}.intro{font-size:12px;color:var(--muted);margin:0 0 14px}.people{display:grid;grid-template-columns:1fr 1fr;gap:19px 22px;align-items:start}.person{min-width:0;border-top:1px solid var(--line);padding-top:10px}.person.featured{grid-column:1/-1;border-top:3px solid var(--red);padding-top:13px;min-height:245px}.person-head{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:0 0 9px;border:0;background:none}.initials{font-size:12px;font-weight:700;color:var(--red);border:1px solid var(--red);width:31px;height:38px;display:grid;place-items:center;flex-shrink:0}.name{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:-1px}.featured .name{font-size:56px;color:var(--red)}.featured .initials{width:43px;height:51px;font-size:16px;background:var(--red);color:var(--paper)}.person-meta{font-size:11px;color:var(--muted);margin:0 0 9px}.person-meta strong{color:var(--ink);font-weight:600}.active-note{float:right;color:var(--red)}ol{padding:0;margin:0;list-style:none;counter-reset:priority}.work{counter-increment:priority;display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px;padding:9px 0;border-top:1px solid var(--line)}.work:before{content:counter(priority,decimal-leading-zero);font-family:Georgia,serif;color:var(--red);padding-top:2px;font-size:13px}.ticket-title{padding:0;border:0;text-align:left;line-height:1.35;background:none;width:100%;font-weight:600}.selected .ticket-title{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}.ticket-meta{font-size:10px;color:var(--muted);margin-top:4px}.work-controls{display:flex;gap:5px;align-items:center;margin-top:7px}.icon{display:inline-grid;place-items:center;padding:3px;width:26px;height:24px;border:1px solid var(--line);background:transparent;border-radius:2px}.icon svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5}.return{background:none;border:0;font-size:10px;padding:3px 0;margin-left:auto;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}.empty{color:var(--muted);font-family:Georgia,serif;font-style:italic;font-size:15px;line-height:1.5;padding:14px 0;margin:0}.sidebar{border-left:1px solid var(--line);background:#fcf5ee;display:flex;flex-direction:column;min-width:0}.tray{padding:20px 17px 15px;flex:1}.tray h2{font:25px Georgia,serif;margin:0 0 6px}.sub{font-size:11px;color:var(--muted);margin:0 0 12px;line-height:1.5}.tray-list{display:grid;gap:0}.tray-ticket{border:0;border-top:1px solid var(--line);text-align:left;background:transparent;display:block;padding:11px 7px;width:100%}.tray-ticket[aria-pressed=true]{background:#eed8cc;box-shadow:inset 0 0 0 1px #c7876d}.tray-ticket strong{display:block;font-size:12px;line-height:1.35;font-weight:600}.tray-ticket small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.assign-panel{padding:17px;border-top:1px solid #cd9e8e;background:#f4e3d9}.assign-panel h2{font:23px Georgia,serif;margin:0 0 10px}.selected-label{font-size:10px;color:var(--muted);margin-bottom:5px}.assignment-title{font-size:13px;line-height:1.4;margin:0 0 8px;font-weight:600}.assignment-owner{font-size:11px;color:var(--muted);margin:0 0 12px}label{font-size:11px;display:block;margin-bottom:5px}select{width:100%;padding:7px;background:var(--paper);border:1px solid #bb9684;border-radius:2px}.assign{width:100%;padding:10px 8px;color:var(--paper);background:var(--red);border:1px solid var(--red);margin-top:8px;border-radius:2px;font-weight:600}.assign:hover:not(:disabled){background:#922a20}.backlog-return{display:block;width:100%;font-size:11px;background:transparent;border:0;text-decoration:underline;text-underline-offset:3px;margin-top:8px;padding:5px}.status{font-size:11px;color:var(--muted);padding:10px 20px;border-top:1px solid var(--line);min-height:35px;margin:0}@media(min-width:1000px){main{grid-template-columns:minmax(0,2.4fr) minmax(250px,1fr)}.roster{padding:25px 35px}.people{gap:25px 35px}.featured .name{font-size:68px}.person.featured{min-height:280px}.ticket-title{font-size:14px}}@media(max-width:560px){header{padding:12px;gap:7px}header p{max-width:60px}.roster{padding:15px 12px}main{grid-template-columns:1fr}.sidebar{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.assign-panel{border-top:0;border-left:1px solid var(--line)}.featured .name{font-size:48px}.person.featured{min-height:0}.people{gap:16px}.tray,.assign-panel{padding:14px 12px}}
</style>
</head>
<body>
<!-- Candidate 21: People first. Exploratory preference-tournament draft; asymmetric editorial profiles, shared tray, person-led assignment. -->
<header><h1>People desk</h1><p>Sprint planning · Demo data</p><div class="tools"><button type="button" data-action="undo" id="undo">Undo</button><button type="button" data-action="reset" id="reset">Reset</button></div></header>
<main id="desk"></main>
<p class="status" role="status" aria-live="polite" id="status">Select a person, then give them something to work on.</p>
<script type="module">
import {createDemo} from '/candidate-kit.js';
let selectedPerson='maya';
let selectedTicket=null;
let position='last';
let status='Select a person, then give them something to work on.';
const demo=createDemo(render);
const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const arrow=up=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${up?'M3 10l5-5 5 5':'M3 6l5 5 5-5'}"/></svg>`;
function render(){
 const focusId=document.activeElement?.id;
 const people=demo.owners.filter(person=>person.id!=='backlog');
 const active=people.find(person=>person.id===selectedPerson);
 const ordered=[active,...people.filter(person=>person.id!==selectedPerson)];
 const selected=demo.tickets.find(ticket=>ticket.id===selectedTicket);
 const owner=selected?demo.owners.find(person=>person.id===demo.ownerOf(selected.id)):null;
 const backlog=demo.list('backlog');
 document.getElementById('desk').innerHTML=`<section class="roster" aria-label="Developer roster"><p class="intro">Start with a person. Their list runs from first to last.</p><div class="people">${ordered.map(person=>{
  const featured=person.id===selectedPerson;
  const tickets=demo.list(person.id);
  return `<article class="person ${featured?'featured':''}" data-owner="${person.id}"><button class="person-head" id="person-${person.id}" data-action="person" data-person="${person.id}" aria-pressed="${featured}" aria-label="Select ${escape(person.name)}"><span class="initials">${escape(person.initials)}</span><span class="name">${escape(person.name)}</span></button><p class="person-meta"><strong>${demo.points(person.id)} points</strong> · ${tickets.length} tickets ${featured?'<span class="active-note">Selected person</span>':''}</p><ol aria-label="${escape(person.name)} priority order">${tickets.map((ticket,index)=>`<li class="work ${ticket.id===selectedTicket?'selected':''}" data-ticket-id="${ticket.id}"><div><button class="ticket-title" id="ticket-${ticket.id}" data-action="ticket" data-ticket="${ticket.id}" aria-pressed="${ticket.id===selectedTicket}">${escape(ticket.title)}</button><div class="ticket-meta">${escape(ticket.id)} · ${ticket.points} pt · ${escape(ticket.kind)}</div>${featured?`<div class="work-controls"><button class="icon" id="earlier-${ticket.id}" data-action="earlier" data-ticket="${ticket.id}" aria-label="Move ${escape(ticket.id)} earlier" ${index===0?'disabled':''}>${arrow(true)}</button><button class="icon" id="later-${ticket.id}" data-action="later" data-ticket="${ticket.id}" aria-label="Move ${escape(ticket.id)} later" ${index===tickets.length-1?'disabled':''}>${arrow(false)}</button><button class="return" id="return-${ticket.id}" data-action="return" data-ticket="${ticket.id}" aria-label="Return ${escape(ticket.id)} to shared tray">Return to tray</button></div>`:''}</div></li>`).join('')}</ol>${tickets.length?'':'<p class="empty">A little room for what comes next.<br>Choose something from the tray.</p>'}</article>`;
 }).join('')}</div></section><aside class="sidebar"><section class="tray" aria-label="Unassigned tickets"><h2>Shared tray <span style="font-size:15px;color:var(--muted)">${backlog.length}</span></h2><p class="sub">Unassigned work, ready for a person.<br>${demo.points('backlog')} points to share.</p><div class="tray-list">${backlog.map(ticket=>`<button class="tray-ticket" id="ticket-${ticket.id}" data-action="ticket" data-ticket="${ticket.id}" aria-pressed="${ticket.id===selectedTicket}"><strong>${escape(ticket.title)}</strong><small>${escape(ticket.id)} · ${ticket.points} pt · ${escape(ticket.kind)}</small></button>`).join('')||'<p class="empty">Everything has a person.</p>'}</div></section><section class="assign-panel" aria-label="Selected person assignment"><h2>For ${escape(active.name)}</h2>${selected?`<div class="selected-label">Selected ticket · ${escape(selected.id)}</div><p class="assignment-title">${escape(selected.title)}</p><p class="assignment-owner">${owner.id==='backlog'?'In the shared tray':`With ${escape(owner.name)}`} · ${selected.points} points</p><label for="position">Place in ${escape(active.name)}’s list</label><select id="position"><option value="last" ${position==='last'?'selected':''}>Last — after current work</option><option value="first" ${position==='first'?'selected':''}>First — make it the priority</option></select><button id="assign" class="assign" data-action="assign">${owner.id===active.id?'Place for':'Assign to'} ${escape(active.name)}</button>${owner.id!=='backlog'?`<button class="backlog-return" id="selected-return" data-action="return" data-ticket="${selected.id}">Return selected ticket to shared tray</button>`:''}`:'<p class="sub">Choose a ticket from the shared tray or anyone’s list to assign it here.</p>'}</section></aside>`;
 document.getElementById('status').textContent=status;
 if(focusId)document.getElementById(focusId)?.focus({preventScroll:true});
}
document.addEventListener('change',event=>{if(event.target.id==='position')position=event.target.value;});
document.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');
 if(!button)return;
 const action=button.dataset.action;
 const id=button.dataset.ticket;
 if(action==='person'){selectedPerson=button.dataset.person;status=`Planning for ${demo.owners.find(person=>person.id===selectedPerson).name}.`;render();}
 else if(action==='ticket'){selectedTicket=id;status=`${id} selected. Choose its place in the selected person’s list.`;render();}
 else if(action==='assign'&&selectedTicket){const list=demo.list(selectedPerson).filter(ticket=>ticket.id!==selectedTicket);status=`${selectedTicket} placed ${position} for ${demo.owners.find(person=>person.id===selectedPerson).name}.`;demo.move(selectedTicket,selectedPerson,position==='first'?(list[0]?.id??null):null);}
 else if(action==='return'){status=`${id} returned to the shared tray.`;demo.move(id,'backlog');}
 else if(action==='earlier'||action==='later'){status=`${id} moved ${action} in the priority order.`;demo.shift(id,action==='earlier'?-1:1);}
 else if(action==='undo'){status='Undo requested for the last work change.';demo.undo();document.getElementById('status').textContent=status;}
 else if(action==='reset'){selectedTicket=null;status='Demo assignments restored.';demo.reset();}
});
selectedTicket=demo.list('backlog')[0]?.id??null;
render();
</script>
</body>
</html>
