<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic planning board</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#343b35;background:#e8e7df;font-size:13px;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #185a75;outline-offset:3px}button:disabled{opacity:.4;cursor:default}::selection{background:#b8d7c9}button:hover:not(:disabled){filter:brightness(.96)}#app{min-height:100dvh;display:flex;flex-direction:column}header{padding:13px 18px 10px;display:flex;align-items:center;gap:10px}h1{font-family:Georgia,serif;font-weight:normal;font-size:23px;letter-spacing:-.5px;margin:0}header .demo{font-size:10px;border:1px solid #9fa599;padding:3px 5px;text-transform:uppercase;white-space:nowrap}.tools{margin-left:auto;display:flex;gap:5px}.tools button{border:1px solid #aeb1a7;border-radius:4px;padding:6px 10px;background:#f6f5ef}.instruction{margin:0 18px 9px;color:#596156;font-size:11px}.mat{position:relative;flex:1;min-height:425px;margin:0 12px 10px;background:#f4f2e9;box-shadow:0 3px 13px #51564b18;isolation:isolate;overflow:hidden}.mat:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#9a9d881c .65px,transparent .65px);background-size:7px 7px;z-index:-1}.territory{position:absolute;padding:37px 12px 12px;border:1px dashed #979d8988;display:flex;flex-direction:column;transition:background .1s}.territory[data-owner="backlog"]{left:2%;top:3%;width:32%;height:57%;--tape:#d9d4bd;--tile:#fffdf1;transform:rotate(-.6deg)}.territory[data-owner="maya"]{left:38%;top:3%;width:59%;height:42%;--tape:#d3dfc6;--tile:#f8fceb;transform:rotate(.4deg)}.territory[data-owner="leo"]{left:3%;top:66%;width:47%;height:31%;--tape:#c7dce2;--tile:#f2fafb;transform:rotate(.35deg)}.territory[data-owner="priya"]{left:55%;top:51%;width:42%;height:46%;--tape:#e8cec3;--tile:#fff6ef;transform:rotate(-.5deg)}.territory.over{background:#dce7d0;border:2px solid #637c56}.territory h2{position:absolute;left:12px;top:-11px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;margin:0;padding:8px 16px;background:var(--tape);clip-path:polygon(2% 0,99% 3%,97% 98%,0 96%);transform:rotate(-1deg)}.territory h2 small{font-size:10px;font-weight:500}.tiles{overflow:auto;scrollbar-width:thin;scrollbar-color:#a7af9d transparent;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:10px;padding:3px 4px 7px;min-height:0;flex:1}.tile{position:relative;flex:1 1 130px;min-width:110px;max-width:230px;text-align:left;border:0;border-radius:1px;box-shadow:1px 3px 5px #62634c25;background:var(--tile);padding:9px 10px 10px;transform:rotate(-.7deg);min-height:92px;touch-action:manipulation}.tile:nth-child(even){transform:rotate(1deg)}.tile[aria-pressed="true"]{outline:2px solid #45614e;outline-offset:1px;box-shadow:1px 4px 8px #62634c35}.tile:focus-visible{outline:3px solid #185a75;outline-offset:2px}.tile.dragging{opacity:.4}.tile.drop-before{box-shadow:-4px 0 0 #45614e}.ticket-meta{font-size:9px;display:flex;justify-content:space-between;gap:4px;color:#586054}.tile strong{display:block;font-size:12px;font-weight:600;line-height:1.35;margin-top:5px}.ticket-foot{display:flex;justify-content:space-between;gap:5px;font-size:9px;margin-top:7px;color:#596156}.rank{font-weight:700}.empty{font-family:Georgia,serif;font-style:italic;font-size:14px;color:#697461;margin:auto;padding:12px 0}.mat-note{position:absolute;left:36%;top:49%;width:17%;font-family:Georgia,serif;font-style:italic;font-size:12px;line-height:1.4;color:#68705e;transform:rotate(-4deg);pointer-events:none}.mat-note span{display:block;font-family:inherit;font-size:20px;line-height:1.3}.dock{margin:0 12px 10px;padding:11px 13px;background:#faf9f3;border-top:2px solid #6b7965;display:flex;flex-direction:column;gap:9px}.selected-heading{display:flex;gap:8px;align-items:baseline;min-width:0}.selected-heading small{font-size:10px;white-space:nowrap;color:#596156}.selected-heading strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dock-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.dock-label{font-size:10px;color:#596156;margin-right:3px}.assign{background:#efefe7;border:1px solid #c3c7b8;border-radius:3px;padding:6px 9px;font-size:11px}.assign[aria-pressed="true"]{background:#3f5847;border-color:#3f5847;color:#fff}.priority{display:flex;align-items:center;gap:5px;margin-left:auto}.priority button{background:transparent;border:1px solid #b8bfae;border-radius:3px;padding:6px 9px;font-size:11px}.priority span{font-size:10px;color:#596156}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-height:700px){.mat{min-height:490px}}@media(max-width:530px){header{padding:10px 12px}h1{font-size:20px}.demo{display:none}.tools button{padding:5px 7px}.mat{min-height:600px}.territory[data-owner="backlog"]{width:43%;height:52%}.territory[data-owner="maya"]{left:50%;width:47%;height:42%}.territory[data-owner="leo"]{top:61%;width:44%;height:36%}.territory[data-owner="priya"]{left:52%;top:49%;width:45%;height:48%}.territory{padding-left:7px;padding-right:7px}.territory h2{left:5px;padding:8px 10px;gap:5px}.mat-note{left:6%;top:55%;width:40%;font-size:10px}.mat-note span{display:inline;font-size:13px}.priority{margin-left:0}.dock-label{width:100%}.selected-heading{flex-wrap:wrap;gap:3px}.selected-heading strong{white-space:normal}}
</style>
</head>
<body>
<!-- Magnetic planning board: exploration draft. Asymmetric paper territories replace kanban columns; tickets snap into an owner's priority order rather than retain arbitrary pixel positions. -->
<div id="app"></div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script type="module">
import {createDemo} from '/candidate-kit.js';
const app=document.querySelector('#app');
let selected='SPR-101';
let dragging=null;
const escapeHTML=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const demo=createDemo(render);
function render(){
 const focusKey=document.activeElement?.dataset.focus;
 const ticket=demo.tickets.find(item=>item.id===selected)??demo.tickets[0];
 selected=ticket.id;
 const owner=demo.ownerOf(selected);
 const queue=demo.list(owner);
 const position=queue.findIndex(item=>item.id===selected);
 app.innerHTML=`<header><h1>Magnetic planning board</h1><span class="demo">Demo data</span><div class="tools"><button data-action="undo" data-focus="undo">Undo</button><button data-action="reset" data-focus="reset">Reset</button></div></header>
 <p class="instruction">Drag a ticket to a territory. Drop on another ticket to place it before. Or select a tile and use the controls below.</p>
 <main class="mat" aria-label="Sprint planning mat">${demo.owners.map(person=>`<section class="territory" data-owner="${person.id}" aria-label="${escapeHTML(person.name)} territory"><h2>${escapeHTML(person.name)} <small>${demo.points(person.id)} pts · ${demo.list(person.id).length}</small></h2><div class="tiles">${demo.list(person.id).map((item,index)=>`<button class="tile" draggable="true" data-ticket="${item.id}" data-focus="${item.id}" aria-pressed="${selected===item.id}" aria-label="Select ${item.id}: ${escapeHTML(item.title)}, priority ${index+1}, ${escapeHTML(person.name)}"><span class="ticket-meta"><span>${item.id}</span><span class="rank">#${index+1}</span></span><strong>${escapeHTML(item.title)}</strong><span class="ticket-foot"><span>${escapeHTML(item.kind)}</span><span>${item.points} pts</span></span></button>`).join('')||'<p class="empty">Drop a ticket here</p>'}</div></section>`).join('')}<div class="mat-note">A place for<br>every ticket.<span>Plan together.</span></div></main>
 <section class="dock" aria-label="Selected ticket controls"><div class="selected-heading"><small>${selected} · ${ticket.points} pts</small><strong>${escapeHTML(ticket.title)}</strong></div><div class="dock-actions"><span class="dock-label">Assign to</span>${demo.owners.map(person=>`<button class="assign" data-assign="${person.id}" data-focus="assign-${person.id}" aria-pressed="${owner===person.id}" aria-label="${person.id==='backlog'?'Return '+selected+' to backlog':'Assign '+selected+' to '+escapeHTML(person.name)}">${escapeHTML(person.name)}</button>`).join('')}<div class="priority"><span>Priority ${position+1}/${queue.length}</span><button data-shift="-1" data-focus="earlier" aria-label="Move ${selected} earlier in priority" ${position===0?'disabled':''}>Earlier</button><button data-shift="1" data-focus="later" aria-label="Move ${selected} later in priority" ${position===queue.length-1?'disabled':''}>Later</button></div></div></section>`;
 if(focusKey){const target=Array.from(app.querySelectorAll('[data-focus]')).find(element=>element.dataset.focus===focusKey);if(target&&!target.disabled)target.focus({preventScroll:true});}
}
function announce(message){document.querySelector('#announcement').textContent=message;}
app.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;
 if(button.dataset.ticket){selected=button.dataset.ticket;render();return;}
 if(button.dataset.assign){const owner=button.dataset.assign;if(owner!==demo.ownerOf(selected)){demo.move(selected,owner);announce(`${selected} assigned to ${demo.owners.find(person=>person.id===owner).name}.`);}return;}
 if(button.dataset.shift){demo.shift(selected,Number(button.dataset.shift));announce(`${selected} priority changed.`);return;}
 if(button.dataset.action==='reset'){demo.reset();announce('Demo assignments reset.');}
 if(button.dataset.action==='undo'){demo.undo();announce('Undo requested.');}
});
function clearDropMarks(){app.querySelectorAll('.over,.drop-before').forEach(element=>element.classList.remove('over','drop-before'));}
app.addEventListener('dragstart',event=>{
 const tile=event.target.closest('[data-ticket]');
 if(!tile)return;
 dragging=tile.dataset.ticket;
 event.dataTransfer.setData('text/plain',dragging);
 event.dataTransfer.effectAllowed='move';
 tile.classList.add('dragging');
});
app.addEventListener('dragover',event=>{
 const zone=event.target.closest('[data-owner]');
 if(!zone||!dragging)return;
 event.preventDefault();event.dataTransfer.dropEffect='move';clearDropMarks();zone.classList.add('over');
 const target=event.target.closest('[data-ticket]');
 if(target&&target.dataset.ticket!==dragging)target.classList.add('drop-before');
});
app.addEventListener('dragleave',event=>{const zone=event.target.closest('[data-owner]');if(zone&&!zone.contains(event.relatedTarget))clearDropMarks();});
app.addEventListener('drop',event=>{
 const zone=event.target.closest('[data-owner]');
 if(!zone)return;
 event.preventDefault();clearDropMarks();
 const id=event.dataTransfer.getData('text/plain');
 if(!demo.tickets.some(ticket=>ticket.id===id))return;
 const target=event.target.closest('[data-ticket]');
 const before=target?.dataset.ticket??null;
 selected=id;dragging=null;
 if(before===id){render();return;}
 demo.move(id,zone.dataset.owner,before);
 announce(`${id} moved to ${demo.owners.find(person=>person.id===zone.dataset.owner).name}${before?' before '+before:''}.`);
});
app.addEventListener('dragend',()=>{dragging=null;clearDropMarks();app.querySelectorAll('.dragging').forEach(element=>element.classList.remove('dragging'));});
render();
</script>
</body>
</html>
