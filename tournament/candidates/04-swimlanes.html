<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint routes — horizontal swimlanes</title>
<!-- Candidate 04: horizontal developer routes with an unassigned docking strip. Exploration draft for preference ranking, not production polish. -->
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#10315d;background:#f2f7ff;font-synthesis:none;--blue:#0863ef;--line:#b7d2f7}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,select{color:inherit;border:1px solid #a8c6ec;background:#fff;border-radius:3px}button{cursor:pointer}button:hover,select:hover{background:#eaf2ff}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #ed9900;outline-offset:2px}header{height:62px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--blue);color:white}.mark{font-size:24px;font-weight:900;border:2px solid white;line-height:29px;width:34px;text-align:center}h1{font-size:20px;letter-spacing:-.6px;margin:0}.subtitle{font-size:11px;opacity:.9;margin-top:3px}.tools{display:flex;gap:6px;margin-left:auto}.tools button{padding:7px 10px;border-color:#fff;font-size:12px}.demo{font-size:10px;text-transform:uppercase;letter-spacing:1px;background:#fff;color:#0752c4;padding:4px 6px;margin-left:4px;white-space:nowrap}main{padding:12px 14px 0}.dock{border:1px solid var(--line);background:#e4efff;margin-bottom:9px}.dock-heading{display:flex;align-items:center;padding:7px 10px 0;gap:8px}.dock-heading h2{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:1px}.count{font-size:11px}.dock-heading .hint{margin-left:auto;font-size:11px;color:#45638c}.track{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#8db8f2 transparent;padding:7px 10px 8px;min-width:0}.ticket{width:211px;flex:0 0 211px;background:#fff;border:1px solid #a9c7ee;position:relative;padding:8px 9px 7px;box-shadow:0 2px 0 #d5e5fb}.ticket-meta{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#4d6485;letter-spacing:.3px}.ticket-id{font-weight:700}.points{font-weight:700;color:#0b56c3}.ticket h3{font-size:12px;line-height:16px;margin:5px 0 7px;min-height:32px;font-weight:600}.ticket-controls{display:flex;gap:4px;align-items:center}.ticket-controls select{width:122px;min-width:0;padding:4px 3px;font-size:11px;height:26px}.ticket-controls button{width:27px;height:26px;font-size:15px;padding:0}.axis{display:flex;align-items:center;gap:9px;font-size:10px;color:#2a639f;text-transform:uppercase;letter-spacing:1px;height:27px;margin-left:103px}.axis-line{height:1px;background:#91b9ec;flex:1;position:relative}.axis-line:after{content:'';position:absolute;right:0;top:-3px;border-left:5px solid #91b9ec;border-top:3px solid transparent;border-bottom:3px solid transparent}.lane{display:grid;grid-template-columns:103px minmax(0,1fr);border-top:1px solid var(--line);background:white;min-height:136px}.lane:last-child{border-bottom:1px solid var(--line)}.owner{padding:19px 10px 10px 4px;border-right:1px solid #d5e4fa;display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:#f2f7ff}.owner h2{margin:0;font-size:15px}.owner .initials{font-size:10px;font-weight:700;letter-spacing:1px;color:white;background:var(--blue);padding:4px 5px;border-radius:2px}.owner small{font-size:10px;color:#506a8b}.lane .track{position:relative;padding-top:22px;padding-bottom:10px;gap:20px;background:linear-gradient(var(--blue),var(--blue)) 0 14px/calc(100% - 8px) 3px no-repeat}.lane .ticket:before{content:'';width:9px;height:9px;border:2px solid var(--blue);background:#fff;border-radius:50%;position:absolute;left:12px;top:-14px}.sequence{position:absolute;left:27px;top:-18px;background:#fff;color:#0054cc;padding:0 4px;font-size:9px;line-height:13px;font-weight:bold}.lane .ticket:after{content:'›';position:absolute;right:-15px;top:44px;color:var(--blue);font-size:23px}.lane .ticket:last-of-type:after{content:none}.empty{font-size:12px;color:#527099;align-self:center;white-space:nowrap;padding:18px 8px}.dock .empty{padding:26px 8px}.end{flex:0 0 80px;font-size:10px;align-self:center;color:#6c83a0;line-height:15px;padding:0 5px}footer{display:flex;gap:12px;justify-content:space-between;font-size:10px;color:#48668b;padding:9px 15px 10px}.kind{text-transform:capitalize}.dock .ticket{box-shadow:none}.dock .track{padding-top:8px} @media(min-height:750px){.lane{min-height:164px}.lane .track{padding-top:28px;background-position-y:19px}.lane .ticket{align-self:start}.owner{padding-top:28px}main{padding-top:18px}.dock{margin-bottom:16px}}@media(max-width:480px){header{padding:0 10px;gap:7px}h1{font-size:17px}.mark{display:none}.demo{display:none}main{padding-left:8px;padding-right:8px}.lane{grid-template-columns:83px minmax(0,1fr)}.axis{margin-left:83px}.dock-heading .hint{display:none}.owner h2{font-size:13px}footer{flex-wrap:wrap;gap:4px}}
</style>
</head>
<body>
<header><div class="mark" aria-hidden="true">↗</div><div><h1>Sprint routes</h1><div class="subtitle">Assign a route. Set the running order.</div></div><span class="demo">Demo data</span><div class="tools"><button id="undo" type="button">Undo</button><button id="reset" type="button">Reset</button></div></header>
<main id="board"></main>
<footer><span id="summary" role="status" aria-live="polite"></span><span>Left = higher priority · No dates implied</span></footer>
<script type="module">
import {createDemo} from '/candidate-kit.js';
const board=document.querySelector('#board');
const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const demo=createDemo(render);
function ticketCard(ticket,owner,index,length){
  const id=escape(ticket.id);
  return `<article class="ticket" data-ticket-id="${id}">${owner!=='backlog'?`<span class="sequence">${String(index+1).padStart(2,'0')}</span>`:''}<div class="ticket-meta"><span class="ticket-id">${id}</span><span class="points">${ticket.points} pt</span></div><h3>${escape(ticket.title)}</h3><div class="ticket-controls"><select data-action="assign" data-ticket="${id}" data-control="assign-${id}" aria-label="Assign ${id}">${demo.owners.map(person=>`<option value="${person.id}" ${person.id===owner?'selected':''}>${person.id==='backlog'?'Unassigned dock':escape(person.name)}</option>`).join('')}</select><button type="button" data-action="earlier" data-ticket="${id}" data-control="earlier-${id}" aria-label="Move ${id} earlier in priority" title="Higher priority" ${index===0?'disabled':''}>←</button><button type="button" data-action="later" data-ticket="${id}" data-control="later-${id}" aria-label="Move ${id} later in priority" title="Lower priority" ${index===length-1?'disabled':''}>→</button></div></article>`;
}
function render(){
  const focused=document.activeElement?.dataset.control;
  const positions=new Map([...board.querySelectorAll('[data-track]')].map(track=>[track.dataset.track,track.scrollLeft]));
  const backlog=demo.list('backlog');
  board.innerHTML=`<section class="dock" aria-label="Unassigned docking strip"><div class="dock-heading"><h2>Unassigned dock</h2><span class="count">${backlog.length} tickets · ${demo.points('backlog')} pt</span><span class="hint">Choose a developer to dispatch ↓</span></div><div class="track" data-track="backlog" tabindex="0" aria-label="Unassigned tickets, scroll horizontally">${backlog.length?backlog.map((ticket,index)=>ticketCard(ticket,'backlog',index,backlog.length)).join(''):'<div class="empty">Dock clear — every ticket has a route.</div>'}</div></section><div class="axis"><span>First up</span><div class="axis-line"></div><span>Then next</span></div>${demo.owners.filter(owner=>owner.id!=='backlog').map(owner=>{const tickets=demo.list(owner.id);return `<section class="lane" data-owner="${owner.id}" aria-label="${escape(owner.name)} priority lane"><div class="owner"><span class="initials">${escape(owner.initials)}</span><h2>${escape(owner.name)}</h2><small>${tickets.length} tickets · ${demo.points(owner.id)} pt</small></div><div class="track" data-track="${owner.id}" tabindex="0" aria-label="${escape(owner.name)} tickets, ordered left to right">${tickets.length?tickets.map((ticket,index)=>ticketCard(ticket,owner.id,index,tickets.length)).join(''):'<div class="empty">Open route. Assign a ticket from the dock.</div>'}${tickets.length?'<div class="end">END OF<br>QUEUE →</div>':''}</div></section>`;}).join('')}`;
  board.querySelectorAll('[data-track]').forEach(track=>{track.scrollLeft=positions.get(track.dataset.track)||0;});
  if(focused){const control=[...board.querySelectorAll('[data-control]')].find(element=>element.dataset.control===focused);if(control&&!control.disabled)control.focus({preventScroll:true});}
  document.querySelector('#summary').textContent=`${demo.tickets.length-backlog.length} of ${demo.tickets.length} tickets assigned · Scratch workspace`;
}
board.addEventListener('change',event=>{const control=event.target.closest('[data-action="assign"]');if(control)demo.move(control.dataset.ticket,control.value);});
board.addEventListener('click',event=>{const control=event.target.closest('button[data-action]');if(!control)return;demo.shift(control.dataset.ticket,control.dataset.action==='earlier'?-1:1);});
document.querySelector('#undo').addEventListener('click',()=>demo.undo());
document.querySelector('#reset').addEventListener('click',()=>demo.reset());
render();
</script>
</body>
</html>
