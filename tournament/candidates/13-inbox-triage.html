<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint inbox — demo</title>
<!-- Candidate 13: email-client sprint triage. Exploration draft for comparison, not production polish. -->
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#24374c;background:#fff;font-size:13px;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,select{border:1px solid #bcc9d7;border-radius:4px;background:#fff;color:#28435e;padding:7px 9px}button{cursor:pointer}button:hover{background:#e7eff8}button:disabled{opacity:.42;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2e75c1;outline-offset:2px}::selection{background:#c3dcf7}*{scrollbar-color:#afc0d2 #edf2f7;scrollbar-width:thin}header{height:55px;display:flex;align-items:center;gap:10px;background:#263e57;color:white;padding:0 16px}header h1{font-size:18px;margin:0;letter-spacing:-.4px}header .demo{color:#d4e3f2;font-size:11px}header .actions{margin-left:auto;display:flex;gap:6px}header button{background:#344f6b;border-color:#6d839a;color:white;padding:6px 9px}header button:hover{background:#466586}.workspace{height:calc(100dvh - 89px);min-height:440px;display:grid;grid-template-columns:122px minmax(220px,38%) minmax(250px,1fr)}nav{background:#edf2f7;border-right:1px solid #ccd6e0;padding:19px 8px;overflow:auto}.nav-label{font-size:10px;font-weight:bold;letter-spacing:1px;color:#60748a;padding:0 8px;margin:0 0 10px}.folder{width:100%;text-align:left;border:0;background:transparent;margin-bottom:5px;padding:10px 8px;display:grid;grid-template-columns:1fr auto;gap:6px}.folder.active{background:#d1e2f4;color:#174c81}.folder strong{font-size:12px}.folder small{grid-column:1/-1;font-size:10px;color:#516b84}.count{font-size:11px}.nav-note{margin:28px 8px 0;color:#65798f;font-size:11px;line-height:1.6}.subjects{border-right:1px solid #ccd6e0;display:flex;flex-direction:column;min-width:0;background:#fbfcfe}.list-heading{height:63px;padding:14px 13px;border-bottom:1px solid #d8e0e9}.list-heading h2{margin:0 0 4px;font-size:16px}.muted{color:#61768c;font-size:11px}.bulk{padding:9px 10px;background:#f0f4f8;border-bottom:1px solid #d8e0e9;display:flex;gap:5px;align-items:center;flex-wrap:wrap}.bulk label{display:flex;align-items:center;font-size:11px;width:100%;gap:5px}.bulk select{flex:1;min-width:0;font-size:11px;padding:6px}.bulk button{font-size:11px;padding:6px}.subject-list{overflow:auto;flex:1}.subject{display:flex;align-items:flex-start;gap:4px;border-bottom:1px solid #e0e7ee;min-height:91px;padding:11px 7px 9px}.subject.active{background:#e0edfa}.subject input{margin:4px 3px 0;accent-color:#2567a9}.open-ticket{flex:1;min-width:0;text-align:left;padding:0 4px;border:0;background:transparent;border-radius:0}.open-ticket:hover{background:transparent;color:#155ca1}.subject-meta{display:flex;justify-content:space-between;gap:5px;font-size:10px;color:#55718d;margin-bottom:6px}.subject-title{display:block;font-size:12px;font-weight:bold;line-height:1.45;margin-bottom:5px}.subject-kind{font-size:10px;color:#61758a}.reading{overflow:auto;min-width:0}.reading-toolbar{height:63px;background:#f8fafc;border-bottom:1px solid #d8e0e9;padding:13px;display:flex;align-items:center;gap:7px;color:#61758a;font-size:11px}.reading-toolbar strong{color:#324e6c}.letter{padding:23px 20px}.ticket-id{font-size:11px;color:#496d91}.letter h2{font-size:23px;line-height:1.22;letter-spacing:-.6px;margin:9px 0 23px;font-weight:600}.sender{display:flex;align-items:center;gap:10px;padding-bottom:19px;border-bottom:1px solid #dbe3ec}.avatar{display:grid;place-items:center;width:34px;height:34px;background:#dce8f5;color:#285885;border-radius:50%;font-size:12px;font-weight:bold;flex-shrink:0}.sender p{margin:0;line-height:1.55;font-size:12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 24px}.details dt{font-size:10px;color:#61758a;margin-bottom:5px}.details dd{margin:0;font-size:13px;font-weight:bold}.assign{border-top:1px solid #dbe3ec;padding-top:19px}.assign label{display:block;font-size:12px;font-weight:bold;margin-bottom:8px}.assign-row{display:flex;gap:6px}.assign-row select{min-width:0;flex:1}.primary{background:#2767a6;border-color:#2767a6;color:white}.primary:hover{background:#1b5288}.return{margin-top:9px;width:100%;font-size:12px}.priority{margin-top:25px}.priority-title{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.priority-controls{display:flex;gap:7px}.priority-controls button{flex:1;font-size:11px}.hint{font-size:11px;line-height:1.5;color:#65798d;margin-top:10px}.empty{padding:25px 16px;color:#60758b;font-size:12px;line-height:1.6}.empty strong{display:block;color:#354f69;font-size:16px;margin-bottom:5px}footer{height:34px;background:#edf2f7;border-top:1px solid #ccd6e0;padding:9px 14px;font-size:10px;color:#546d85;display:flex;gap:12px}footer span:last-child{margin-left:auto;white-space:nowrap}@media(max-width:640px){.workspace{grid-template-columns:99px minmax(190px,1fr);height:auto;min-height:calc(100dvh - 89px)}nav{grid-row:1/3}.subjects{height:310px;border-right:0}.reading{grid-column:2;border-top:1px solid #bccad9}.reading-toolbar{height:40px}.letter{padding:18px}.letter h2{font-size:21px}header{padding:0 10px}header .demo{display:none}footer{height:auto;min-height:34px}.nav-note{margin-top:20px}.folder{padding:9px 5px}}
</style>
</head>
<body>
<header><h1>Sprint inbox</h1><span class="demo">Demo data</span><div class="actions"><button id="undo">Undo</button><button id="reset">Reset</button></div></header>
<main class="workspace" id="workspace"></main>
<footer><span id="status" role="status" aria-live="polite">Open a ticket, then assign it to a teammate.</span><span>Demo data · Sprint 24</span></footer>
<script type="module">
import {createDemo} from '/candidate-kit.js';
let folder='backlog',active=null,selected=new Set(),notice='Open a ticket, then assign it to a teammate.';
const workspace=document.querySelector('#workspace');
const demo=createDemo(render);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=id=>id==='backlog'?'Inbox':demo.owners.find(o=>o.id===id).name;
const options=current=>demo.owners.map(o=>`<option value="${o.id}" ${o.id===current?'selected':''}>${esc(o.id==='backlog'?'Inbox (backlog)':o.name)}</option>`).join('');
function render(){
 const tickets=demo.list(folder);
 selected=new Set([...selected].filter(id=>tickets.some(t=>t.id===id)));
 if(!tickets.some(t=>t.id===active)) active=tickets[0]?.id??null;
 const ticket=tickets.find(t=>t.id===active),owner=demo.owners.find(o=>o.id===folder),rank=tickets.findIndex(t=>t.id===active);
 workspace.innerHTML=`<nav aria-label="Owner folders"><p class="nav-label">FOLDERS</p>${demo.owners.map(o=>`<button class="folder ${folder===o.id?'active':''}" data-folder="${o.id}" aria-current="${folder===o.id?'page':'false'}"><strong>${esc(label(o.id))}</strong><span class="count">${demo.list(o.id).length}</span><small>${demo.points(o.id)} points${o.id==='backlog'?' · unassigned':''}</small></button>`).join('')}<p class="nav-note">One folder per owner.<br>Top of the list = first priority.</p></nav>
 <section class="subjects" aria-label="Ticket subject list"><div class="list-heading"><h2>${esc(label(folder))}</h2><span class="muted">${tickets.length} tickets · ${demo.points(folder)} points</span></div><div class="bulk"><label><input id="select-all" type="checkbox" ${tickets.length&&selected.size===tickets.length?'checked':''} ${!tickets.length?'disabled':''}> ${selected.size?selected.size+' selected':'Select tickets'}</label><select id="bulk-owner" aria-label="Owner for selected tickets">${options(folder==='backlog'?'maya':'backlog')}</select><button id="bulk-assign" ${selected.size?'':'disabled'}>Move selected</button></div><div class="subject-list">${tickets.length?tickets.map((t,i)=>`<article class="subject ${t.id===active?'active':''}" data-ticket-id="${t.id}"><input type="checkbox" data-select="${t.id}" aria-label="Select ${t.id}" ${selected.has(t.id)?'checked':''}><button class="open-ticket" data-open="${t.id}" aria-pressed="${t.id===active}"><span class="subject-meta"><span>${t.id}</span><span>${t.points} pt · #${i+1}</span></span><span class="subject-title">${esc(t.title)}</span><span class="subject-kind">${esc(t.kind)}</span></button></article>`).join(''):`<div class="empty"><strong>All clear.</strong>No tickets in this folder. Move tickets here from another owner.</div>`}</div></section>
 <section class="reading" aria-label="Ticket reading pane">${ticket?`<div class="reading-toolbar"><strong>Ticket details</strong><span> / ${esc(ticket.id)}</span></div><div class="letter"><span class="ticket-id">${esc(ticket.id)} · ${esc(ticket.kind)}</span><h2>${esc(ticket.title)}</h2><div class="sender"><span class="avatar">${folder==='backlog'?'IN':esc(owner.initials)}</span><div><p><strong>${folder==='backlog'?'Awaiting assignment':esc(owner.name)}</strong></p><p class="muted">Filed in ${esc(label(folder))}</p></div></div><dl class="details"><div><dt>ESTIMATE</dt><dd>${ticket.points} points</dd></div><div><dt>QUEUE POSITION</dt><dd>${rank+1} of ${tickets.length}</dd></div></dl><div class="assign"><label for="ticket-owner">Assign this ticket</label><div class="assign-row"><select id="ticket-owner">${options(folder)}</select><button class="primary" id="assign">Assign</button></div><button class="return" id="return" ${folder==='backlog'?'disabled':''}>Return to inbox</button></div><div class="priority"><div class="priority-title"><strong>Priority in ${esc(label(folder))}</strong><span>#${rank+1}</span></div><div class="priority-controls"><button id="earlier" ${rank===0?'disabled':''}>Move earlier</button><button id="later" ${rank===tickets.length-1?'disabled':''}>Move later</button></div><p class="hint">New assignments go to the end of the owner's queue. Move earlier to make this ticket a higher priority.</p></div></div>`:`<div class="empty"><strong>No ticket open</strong>Choose a folder with tickets to continue triaging.</div>`}</section>`;
 document.querySelector('#status').textContent=notice;
 workspace.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;active=null;selected.clear();render()});
 workspace.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{active=b.dataset.open;render()});
 workspace.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.dataset.select):selected.delete(c.dataset.select);render()});
 const all=workspace.querySelector('#select-all');all.indeterminate=selected.size>0&&selected.size<tickets.length;all.onchange=()=>{selected=all.checked?new Set(tickets.map(t=>t.id)):new Set();render()};
 workspace.querySelector('#bulk-assign').onclick=()=>{const target=workspace.querySelector('#bulk-owner').value;const ids=tickets.filter(t=>selected.has(t.id)&&demo.ownerOf(t.id)!==target).map(t=>t.id);selected.clear();notice=`${ids.length} ticket${ids.length===1?'':'s'} moved to ${label(target)}. Undo reverses one ticket at a time.`;for(const id of ids)demo.move(id,target);render()};
 if(ticket){
 workspace.querySelector('#assign').onclick=()=>{const target=workspace.querySelector('#ticket-owner').value;if(target===folder){notice=`${ticket.id} is already in ${label(folder)}.`;render();return}notice=`${ticket.id} assigned to ${label(target)}.`;demo.move(ticket.id,target)};
 workspace.querySelector('#return').onclick=()=>{notice=`${ticket.id} returned to inbox.`;demo.move(ticket.id,'backlog')};
 workspace.querySelector('#earlier').onclick=()=>{notice=`${ticket.id} moved earlier in ${label(folder)}.`;demo.shift(ticket.id,-1)};
 workspace.querySelector('#later').onclick=()=>{notice=`${ticket.id} moved later in ${label(folder)}.`;demo.shift(ticket.id,1)};
 }
}
document.querySelector('#undo').onclick=()=>{notice='Undo requested · one ticket change at a time.';demo.undo();render()};
document.querySelector('#reset').onclick=()=>{folder='backlog';active=null;selected.clear();notice='Demo restored to its starting assignments.';demo.reset()};
render();
</script>
</body>
</html>
