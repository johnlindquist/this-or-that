<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command desk · Sprint distribution</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202b37;background:#f3f5f7;font-size:14px;font-synthesis:none;--accent:#235ed8;--line:#dce1e8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #80aaff;outline-offset:2px}button:disabled{opacity:.35;cursor:default}::selection{background:#c0d4ff;color:#14233d}header{height:56px;display:flex;align-items:center;padding:0 22px;gap:12px;background:white;border-bottom:1px solid var(--line)}h1{font-size:17px;letter-spacing:-.03em;margin:0}header small{color:#647184;font-size:11px}header .tools{margin-left:auto;display:flex;gap:6px}.quiet{background:transparent;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px}.quiet:hover{background:#eef2f8}.command{background:#182231;color:#fff;padding:18px 22px 15px}.command label{display:flex;justify-content:space-between;font-size:12px;color:#c4cfdf;margin-bottom:9px}.shortcut{font-size:11px;color:#adbdd2}.input-wrap{display:flex;align-items:center;gap:13px}.prompt{font:24px ui-monospace,monospace;color:#85abff}.command input{width:100%;min-width:0;background:transparent;border:0;color:white;font-size:23px;letter-spacing:-.025em;padding:3px 0;caret-color:#a7c1ff}.command input::placeholder{color:#a6b5c9}.command input:focus-visible{outline-offset:5px}.command-foot{color:#a6b5c9;font-size:11px;margin-top:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);min-height:405px}.results{padding:17px 12px 18px 20px;border-right:1px solid var(--line)}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}h2{font-size:12px;font-weight:650;margin:0}.muted{font-size:11px;color:#657183}.suggestions{display:grid;gap:3px}.ticket{border:1px solid transparent;background:transparent;border-radius:6px;text-align:left;padding:9px 10px;width:100%;display:grid;grid-template-columns:1fr auto;gap:5px 8px}.ticket:hover{background:#e9eef5}.ticket[aria-pressed=true]{background:#e7efff;border-color:#adc5f3}.ticket .name{font-size:12px;font-weight:570;line-height:1.35;grid-column:1/-1}.ticket .meta{font-size:10px;color:#5e6b7d;display:flex;gap:8px;align-items:center}.id{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px}.ticket .points{font-size:10px;align-self:end;color:#657183}.detail{padding:18px 20px 16px 17px;background:white;min-width:0}.selected-title{font-size:16px;line-height:1.3;margin:6px 0 5px;letter-spacing:-.02em}.selected-meta{font-size:11px;color:#677489;margin-bottom:17px}.destinations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:9px 0 12px}.destination{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:white;padding:9px 2px;font-size:11px}.destination[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#eff4ff}.destination:hover{background:#edf3fe}.initials{font-size:13px;font-weight:650}.destination .load{font-size:10px;color:#6a7585}.assignment{display:flex;align-items:end;gap:8px;margin-bottom:20px}.assignment label{flex:1;font-size:11px;color:#566378;min-width:0}.assignment select{display:block;margin-top:5px;width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:8px 5px;color:#25364c;font-size:12px}.execute{border:0;border-radius:5px;background:var(--accent);color:#fff;padding:9px 12px;font-weight:600;font-size:12px}.execute:hover{background:#184cb9}.queue-head{padding-top:14px;border-top:1px solid var(--line);margin-bottom:8px}.queue{margin:0;padding:0;list-style:none}.queue li{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid #edf0f4}.rank{font:11px ui-monospace,monospace;color:#8390a3;width:17px;flex-shrink:0}.queue-name{flex:1;text-align:left;border:0;background:transparent;padding:0;font-size:11px;line-height:1.35;min-width:0}.queue-name small{display:block;font-size:9px;color:#6c798b;margin-top:3px}.queue-name:hover{color:var(--accent)}.arrows{display:flex;gap:3px}.arrow{border:1px solid var(--line);background:#fff;border-radius:3px;min-width:25px;padding:4px;font-size:11px}.arrow:hover:not(:disabled){background:#edf3fe}.empty{font-size:12px;color:#6c788b;padding:20px 5px;line-height:1.5}footer{border-top:1px solid var(--line);background:#f8fafc;padding:9px 21px;color:#53637a;display:flex;gap:14px;justify-content:space-between;font-size:11px}#status{overflow-wrap:anywhere}footer span:last-child{white-space:nowrap;color:#748093}@media(min-width:1000px){.workspace{grid-template-columns:1.2fr 1fr}.suggestions{grid-template-columns:1fr 1fr}.ticket{padding:15px}.command{padding-top:24px;padding-bottom:24px}.detail{padding:23px 28px}}@media(max-width:530px){header{padding:0 12px}header small{display:none}.command{padding:16px 14px}.command input{font-size:20px}.workspace{grid-template-columns:1fr}.results{border-right:0;border-bottom:1px solid var(--line);padding:14px}.suggestions{max-height:215px;overflow:auto}.detail{padding:16px}footer span:last-child{display:none}}
</style>
</head>
<body>
<!-- Command desk: an exploratory keyboard/search-first sprint dispatcher. Dark command entry, concrete suggestions, destination actions and a single focused queue; demo data, not production polish. -->
<header><h1>Command desk</h1><small>SPRINT / DEMO DATA</small><div class="tools"><button class="quiet" data-action="undo">Undo</button><button class="quiet" data-action="reset">Reset</button></div></header>
<section class="command" aria-label="Ticket search">
<label for="search">Find a ticket to dispatch <span class="shortcut">⌘ / Ctrl K to search</span></label>
<div class="input-wrap"><span class="prompt" aria-hidden="true">&gt;</span><input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search title, ID, type or owner…"></div>
<div class="command-foot">Search → Enter to select → choose a destination → set queue position</div>
</section>
<main id="workspace" class="workspace"></main>
<footer><span id="status" role="status" aria-live="polite">Select a ticket. Dispatch with intention.</span><span>Scratch session · Demo data</span></footer>
<script type="module">
import {createDemo} from '/candidate-kit.js';
let selected='SPR-101', destination='maya', before='', query='', message='Select a ticket. Dispatch with intention.';
const workspace=document.querySelector('#workspace');
const search=document.querySelector('#search');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo=createDemo(render);
const ownerName=id=>demo.owners.find(owner=>owner.id===id)?.name??id;
function matches(){const text=query.trim().toLowerCase();return demo.tickets.filter(ticket=>`${ticket.id} ${ticket.title} ${ticket.kind} ${ownerName(demo.ownerOf(ticket.id))}`.toLowerCase().includes(text));}
function choose(id){selected=id;before='';render();document.querySelector(`[data-destination="${destination}"]`)?.focus();}
function render(){
 const active=document.activeElement;const focusKey=active?.dataset.focus;
 const ticket=demo.tickets.find(ticket=>ticket.id===selected);
 const results=matches();const queue=demo.list(destination);const remaining=queue.filter(item=>item.id!==selected);
 if(before&&!remaining.some(item=>item.id===before))before='';
 workspace.innerHTML=`<section class="results" aria-label="Ticket suggestions"><div class="section-title"><h2>${query?'Search results':'All sprint tickets'}</h2><span class="muted">${results.length} tickets</span></div><div class="suggestions">${results.map(item=>`<button class="ticket" data-ticket="${item.id}" data-focus="ticket-${item.id}" aria-pressed="${item.id===selected}"><span class="name">${escapeHtml(item.title)}</span><span class="meta"><span class="id">${item.id}</span><span>${escapeHtml(ownerName(demo.ownerOf(item.id)))}</span></span><span class="points">${item.points} pt</span></button>`).join('')||'<p class="empty">No matching tickets. Try a ticket ID, developer name or a shorter title.</p>'}</div></section>
 <section class="detail" aria-label="Dispatch selected ticket"><span class="id">${ticket.id} · ${escapeHtml(ticket.kind)}</span><h2 class="selected-title">${escapeHtml(ticket.title)}</h2><div class="selected-meta">${ticket.points} points · Currently with ${escapeHtml(ownerName(demo.ownerOf(selected)))}</div><h2>Send to</h2><div class="destinations">${demo.owners.map(owner=>`<button class="destination" data-destination="${owner.id}" data-focus="owner-${owner.id}" aria-pressed="${destination===owner.id}" aria-label="Choose ${escapeHtml(owner.name)} as destination"><span class="initials">${owner.id==='backlog'?'—':escapeHtml(owner.initials)}</span><span>${escapeHtml(owner.name)}</span><span class="load">${demo.points(owner.id)} pt</span></button>`).join('')}</div>
 <div class="assignment"><label for="priority">Priority in ${escapeHtml(ownerName(destination))}<select id="priority" data-focus="priority"><option value="" ${before===''?'selected':''}>Last in queue</option>${remaining.map((item,index)=>`<option value="${item.id}" ${before===item.id?'selected':''}>${index+1}. Before ${item.id}</option>`).join('')}</select></label><button class="execute" data-action="dispatch" data-focus="dispatch">${destination==='backlog'?'Return':'Assign'} ticket</button></div>
 <div class="section-title queue-head"><h2>${escapeHtml(ownerName(destination))} queue</h2><span class="muted">${queue.length} tickets · ${demo.points(destination)} pt</span></div><ol class="queue">${queue.map((item,index)=>`<li data-queue-ticket="${item.id}"><span class="rank">${String(index+1).padStart(2,'0')}</span><button class="queue-name" data-ticket="${item.id}" data-focus="preview-${item.id}" aria-label="Select ${item.id}: ${escapeHtml(item.title)}">${escapeHtml(item.title)}<small>${item.id} · ${item.points} pt${item.id===selected?' · Selected':''}</small></button><div class="arrows"><button class="arrow" data-shift="-1" data-id="${item.id}" data-focus="up-${item.id}" aria-label="Move ${item.id} earlier" ${index===0?'disabled':''}>↑</button><button class="arrow" data-shift="1" data-id="${item.id}" data-focus="down-${item.id}" aria-label="Move ${item.id} later" ${index===queue.length-1?'disabled':''}>↓</button></div></li>`).join('')||'<li class="empty">This queue is empty. Assign the selected ticket to make it first.</li>'}</ol></section>`;
 document.querySelector('#status').textContent=message;
 if(focusKey)workspace.querySelector(`[data-focus="${focusKey}"]`)?.focus();
}
search.addEventListener('input',()=>{query=search.value;render();});
search.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();const first=matches()[0];if(first)choose(first.id);}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();search.focus();search.select();}});
document.addEventListener('change',event=>{if(event.target.id==='priority')before=event.target.value;});
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.ticket){choose(button.dataset.ticket);return;}
 if(button.dataset.destination){destination=button.dataset.destination;before='';render();document.querySelector('#priority').focus();return;}
 if(button.dataset.shift){message=`Moved ${button.dataset.id} ${button.dataset.shift==='-1'?'earlier':'later'} in ${ownerName(destination)}’s queue.`;demo.shift(button.dataset.id,Number(button.dataset.shift));return;}
 if(button.dataset.action==='dispatch'){message=`${selected} → ${ownerName(destination)} · ${before?`before ${before}`:'last in queue'}`;demo.move(selected,destination,before||null);search.focus();search.select();}
 if(button.dataset.action==='undo'){message='Undid the most recent change, if one was available.';demo.undo();document.querySelector('#status').textContent=message;}
 if(button.dataset.action==='reset'){selected='SPR-101';destination='maya';before='';query='';search.value='';message='Demo data restored to the starting sprint.';demo.reset();}
});
render();
</script>
</body>
</html>
