<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priority ladders · Sprint distribution</title>
<!-- Candidate 14: Priority ladders. Exploration draft: shared numbered rungs, three owner rails, separate backlog drawer. -->
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#19151f;background:#f5f2fa;font-synthesis:none;--ink:#19151f;--purple:#d7c4fa;--line:#c5bacf}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;border:1px solid var(--ink);border-radius:0;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:var(--purple)}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #6b32c1;outline-offset:3px}::selection{background:#c4a1ff;color:#19151f}*{scrollbar-color:#8b73a7 #ede6f5;scrollbar-width:thin}#app{height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:16px 18px 12px;gap:10px}header{display:flex;align-items:center;gap:10px}h1{margin:0;font-size:25px;letter-spacing:-.8px;font-weight:800}header .sub{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#5e4b70}header button{padding:7px 10px;font-size:12px}.instruction{font-size:12px;color:#5c4c6b;display:flex;justify-content:space-between;gap:12px}.instruction b{color:var(--ink)}.grid-scroll{flex:1;min-height:180px;overflow:auto;border:1px solid var(--ink);background:#fff}table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}thead{position:sticky;top:0;z-index:2}th{padding:10px 11px;text-align:left;background:var(--ink);color:white;border-right:1px solid #786786}th:first-child{width:47px;padding:10px 4px;text-align:center;font-size:9px;font-weight:400;letter-spacing:1px}th:last-child{border-right:0}.owner-name{font-size:16px;display:flex;align-items:baseline;justify-content:space-between;gap:4px}.owner-name small{font-size:10px;font-weight:400;color:#ddcbed;white-space:nowrap}.owner-meta{display:block;font-size:10px;font-weight:400;color:#ddcbed;margin-top:3px}td{border-bottom:1px solid var(--ink);border-right:1px solid var(--line);height:87px;vertical-align:top;padding:0;position:relative}td:last-child{border-right:0}tr:last-child td{border-bottom:0}.rank{background:#e8dcf8;vertical-align:middle;text-align:center;font-size:28px;font-weight:800;letter-spacing:-1.5px;color:#5c397e;border-right:2px solid var(--ink)}.ticket{width:100%;height:100%;min-height:86px;border:0;text-align:left;padding:9px 10px 23px;display:flex;flex-direction:column;gap:6px;background:#fff}.ticket.selected{background:var(--purple);box-shadow:inset 0 0 0 2px var(--ink)}.ticket .meta{font-size:10px;display:flex;gap:5px;align-items:center;color:#665575}.ticket .meta strong{color:var(--ink);font-weight:500}.ticket .points{margin-left:auto;font-weight:800;color:var(--ink)}.ticket .title{font-size:12px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}.rung-action{position:absolute;bottom:4px;right:6px;padding:2px 5px;font-size:9px;background:#eee7f5;border-color:#8b779c}.empty{width:100%;height:86px;background:#fbf9fd;border:0;color:#806c91;font-size:11px;text-align:left;padding:12px}.empty:not(:disabled):hover{background:#e9dcfc;color:#19151f}.empty span{display:block;font-size:21px;line-height:1;margin-bottom:5px}.editor{background:var(--ink);color:white;padding:10px 12px;display:flex;flex-direction:column;gap:9px}.selection-line{font-size:12px;display:flex;gap:9px;align-items:baseline;min-width:0}.selection-line .selected-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:#e5d8f8}.selection-line strong{white-space:nowrap}.selection-line button{background:transparent;color:#e5d8f8;border-color:#9686a9;padding:3px 7px;font-size:10px;white-space:nowrap}.move-form{display:flex;align-items:end;gap:7px}.move-form label{font-size:10px;color:#d8c7eb;display:flex;flex-direction:column;gap:3px}.move-form select{height:30px;padding:3px 7px;background:#fff}.move-form button{height:30px;padding:5px 11px;font-size:12px;background:var(--purple);font-weight:700}.move-form .step{width:32px;padding:0;display:grid;place-items:center}.step svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}.move-form .hint{margin-left:auto;font-size:10px;color:#c3b2d2;max-width:135px;line-height:1.3;padding-bottom:2px}details{border:1px solid var(--ink);background:#e9e0f3;flex-shrink:0}summary{cursor:pointer;padding:9px 11px;font-size:12px;font-weight:700}summary span{float:right;font-size:10px;font-weight:400;color:#63516f}.drawer{display:flex;gap:8px;overflow:auto;padding:0 10px 10px;max-height:116px}.drawer .ticket{min-width:180px;max-width:220px;min-height:75px;height:auto;flex:1;border:1px solid #9e8caf;padding:8px}.drawer-empty{font-size:12px;color:#63516f;margin:0;padding:3px 0 5px}.footnote{font-size:10px;color:#705e80;margin:0}@media(min-width:1000px){#app{padding:20px 30px}td{height:100px}.ticket,.empty{min-height:100px}.ticket .title{font-size:14px}}@media(max-width:550px){#app{padding:10px 8px;gap:8px}h1{font-size:21px}header .sub{display:none}header button:first-of-type{margin-left:auto}.owner-name{font-size:13px;display:block}.owner-name small{display:block;margin-top:3px}.instruction{font-size:10px}.instruction span:last-child{display:none}.ticket{padding:8px 6px 23px}.ticket .title{font-size:11px}.ticket .meta{font-size:9px;flex-wrap:wrap;gap:3px}.move-form{gap:5px}.move-form .hint{display:none}.move-form button{padding:5px 7px}.selection-line .selected-title{display:none}th:first-child{width:34px}.rank{font-size:23px}th{padding:8px 6px}}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import {createDemo} from '/candidate-kit.js';
const root=document.getElementById('app');
let selected=null, targetOwner='maya', targetRung=1, drawerOpen=true;
const demo=createDemo(render);
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const arrow=direction=>`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="${direction==='up'?'M4 12l6-6 6 6':'M4 8l6 6 6-6'}"/></svg>`;
function ticketButton(ticket,parked=false){return `<button class="ticket ${selected===ticket.id?'selected':''}" data-select="${ticket.id}" data-ticket-id="${ticket.id}" aria-pressed="${selected===ticket.id}" aria-label="Select ${esc(ticket.id+' '+ticket.title)}"><span class="meta"><strong>${esc(ticket.id)}</strong>${parked?'':`<span>${esc(ticket.kind)}</span>`}<span class="points">${ticket.points} pt</span></span><span class="title">${esc(ticket.title)}</span></button>`;}
function render(){
 const active=document.activeElement?.id;
 const owners=demo.owners.filter(owner=>owner.id!=='backlog');
 const ticket=demo.tickets.find(item=>item.id===selected);
 const currentOwner=ticket?demo.ownerOf(ticket.id):null;
 const currentList=currentOwner?demo.list(currentOwner):[];
 const currentIndex=currentList.findIndex(item=>item.id===selected);
 const destinations=demo.list(targetOwner).filter(item=>item.id!==selected);
 targetRung=Math.max(1,Math.min(targetRung,destinations.length+1));
 const rows=Math.max(4,...owners.map(owner=>demo.list(owner.id).length+1));
 root.innerHTML=`<header><h1>Priority ladders</h1><span class="sub">Demo data</span><button id="undo" data-action="undo">Undo</button><button id="reset" data-action="reset">Reset</button></header><div class="instruction"><span><b>Select a ticket.</b> Send it to an owner + rung.</span><span>Top rung = first priority</span></div><section class="grid-scroll" aria-label="Shared priority grid"><table><thead><tr><th scope="col">RUNG</th>${owners.map(owner=>`<th scope="col" data-owner-id="${owner.id}"><span class="owner-name">${esc(owner.name)} <small>${demo.points(owner.id)} pts</small></span><span class="owner-meta">${demo.list(owner.id).length} tickets in priority order</span></th>`).join('')}</tr></thead><tbody>${Array.from({length:rows},(_,index)=>`<tr data-rung="${index+1}"><td class="rank">${String(index+1).padStart(2,'0')}</td>${owners.map(owner=>{const item=demo.list(owner.id)[index];return `<td data-owner-id="${owner.id}" data-rung="${index+1}">${item?ticketButton(item)+(selected&&selected!==item.id?`<button class="rung-action" data-place="${owner.id}" data-rank="${index+1}" aria-label="Move selected ticket to ${esc(owner.name)} rung ${index+1}">Insert here</button>`:''):`<button class="empty" data-place="${owner.id}" data-rank="${index+1}" ${selected?'':'disabled'} aria-label="Move selected ticket to ${esc(owner.name)} next available rung"><span>—</span>${selected?'Place in next free rung':'Unfilled rung'}</button>`}</td>`}).join('')}</tr>`).join('')}</tbody></table></section><section class="editor" aria-label="Move selected ticket"><div class="selection-line"><strong>${ticket?esc(ticket.id):'No ticket selected'}</strong><span class="selected-title">${ticket?esc(ticket.title):'Pick a ticket from any rung or the backlog drawer.'}</span>${ticket&&currentOwner!=='backlog'?'<button data-action="backlog">Return to backlog</button>':''}</div><form class="move-form" id="move-form"><label>Owner<select id="target-owner" aria-label="Destination owner">${owners.map(owner=>`<option value="${owner.id}" ${targetOwner===owner.id?'selected':''}>${esc(owner.name)}</option>`).join('')}</select></label><label>Rung<select id="target-rung" aria-label="Destination priority rung">${Array.from({length:destinations.length+1},(_,index)=>`<option value="${index+1}" ${targetRung===index+1?'selected':''}>${String(index+1).padStart(2,'0')}${index===destinations.length?' · last':''}</option>`).join('')}</select></label><button id="move-ticket" type="submit" ${ticket?'':'disabled'}>Move to rung</button><button class="step" type="button" data-action="up" aria-label="Raise selected ticket one priority" title="Raise one priority" ${ticket&&currentIndex>0?'':'disabled'}>${arrow('up')}</button><button class="step" type="button" data-action="down" aria-label="Lower selected ticket one priority" title="Lower one priority" ${ticket&&currentIndex<currentList.length-1?'':'disabled'}>${arrow('down')}</button><span class="hint">Insert, don’t replace.<br>Lower tickets shift down.</span></form></section><details ${drawerOpen?'open':''}><summary>Backlog drawer · ${demo.list('backlog').length}<span>${demo.points('backlog')} points parked</span></summary><div class="drawer">${demo.list('backlog').length?demo.list('backlog').map(item=>ticketButton(item,true)).join(''):'<p class="drawer-empty">All tickets are on a ladder. Return any ticket here to park it.</p>'}</div></details><p class="footnote">Demo data · scratch assignments only · priorities are local to each owner</p>`;
 root.querySelector('details').addEventListener('toggle',event=>{drawerOpen=event.currentTarget.open;});
 if(active)document.getElementById(active)?.focus({preventScroll:true});
}
function moveTo(owner,rank){if(!selected)return;targetOwner=owner;const remaining=demo.list(owner).filter(ticket=>ticket.id!==selected);targetRung=Math.min(Number(rank),remaining.length+1);demo.move(selected,owner,remaining[targetRung-1]?.id??null);}
root.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.select){selected=button.dataset.select;const owner=demo.ownerOf(selected);if(owner!=='backlog')targetOwner=owner;targetRung=1;render();root.querySelector(`[data-select="${selected}"]`)?.focus({preventScroll:true});return;}
 if(button.dataset.place){moveTo(button.dataset.place,button.dataset.rank);return;}
 const action=button.dataset.action;
 if(action==='undo')demo.undo();
 if(action==='reset'){selected=null;targetRung=1;demo.reset();}
 if(action==='backlog'&&selected)demo.move(selected,'backlog');
 if(action==='up'&&selected)demo.shift(selected,-1);
 if(action==='down'&&selected)demo.shift(selected,1);
});
root.addEventListener('change',event=>{if(event.target.id==='target-owner'){targetOwner=event.target.value;targetRung=1;render();}if(event.target.id==='target-rung')targetRung=Number(event.target.value);});
root.addEventListener('submit',event=>{event.preventDefault();moveTo(targetOwner,targetRung);});
render();
</script>
</body>
</html>
